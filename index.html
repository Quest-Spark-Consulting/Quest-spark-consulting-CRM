<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quest Spark CRM | Coach Command Center</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0ea5e9">
    <link rel="apple-touch-icon" href="https://ivmomvigwanfhwkreqic.supabase.co/storage/v1/object/public/quest-spark/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --sky-blue: #0ea5e9;
            --sky-blue-deep: #0369a1;
            --sky-blue-light: #f0f9ff;
            --accent-red: #ef4444;
            --bg-main: #f8fafc;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --card-bg: #ffffff;
            --border: #e2e8f0;
            --shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -2px rgba(0,0,0,0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg-main); color: var(--text-dark); line-height: 1.6; overflow-x: hidden; }
        h1, h2, h3 { font-family: 'Outfit', sans-serif; font-weight: 800; letter-spacing: -0.02em; }

        .hidden { display: none !important; }
        .btn { display: inline-flex; align-items: center; gap: 0.75rem; padding: 0.875rem 1.75rem; border-radius: 14px; font-weight: 700; cursor: pointer; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); border: none; font-size: 0.95rem; text-decoration: none; }
        .btn-sky { background: linear-gradient(135deg, var(--sky-blue), var(--sky-blue-deep)); color: white; box-shadow: 0 10px 15px -3px rgba(14, 165, 233, 0.3); }
        .btn-sky:hover { transform: translateY(-3px); box-shadow: 0 20px 25px -5px rgba(14, 165, 233, 0.4); }
        .btn-secondary { background: white; color: var(--text-dark); border: 1.5px solid var(--border); }
        .btn-wa { background: #25D366; color: white; }

        .qs-logo {
            width: 70px; height: 70px;
            background: linear-gradient(135deg, var(--sky-blue), var(--sky-blue-deep));
            border-radius: 20px;
            display: flex; align-items: center; justify-content: center;
            font-family: 'Outfit', sans-serif; font-weight: 900; color: white; font-size: 2rem;
            box-shadow: 0 15px 30px rgba(14, 165, 233, 0.3);
            margin: 0 auto 2rem;
            position: relative;
            overflow: hidden;
        }
        .qs-logo::after { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: radial-gradient(circle, rgba(255,255,255,0.2) 0%, transparent 70%); }
        .qs-logo-sm { width: 45px; height: 45px; font-size: 1.25rem; border-radius: 12px; margin: 0; box-shadow: 0 8px 16px rgba(14, 165, 233, 0.2); }

        #loader { position: fixed; inset: 0; background: white; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .spinner { width: 50px; height: 50px; border: 5px solid var(--sky-blue-light); border-top-color: var(--sky-blue); border-radius: 50%; animation: spin 0.8s cubic-bezier(0.4, 0, 0.2, 1) infinite; margin-bottom: 1.5rem; }
        @keyframes spin { to { transform: rotate(360deg); } }

        #auth-gate { min-height: 100vh; display: none; align-items: center; justify-content: center; padding: 2rem; background: radial-gradient(circle at top right, #f0f9ff, #ffffff); }
        .auth-card { background: white; padding: 3.5rem; border-radius: 32px; width: 100%; max-width: 480px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.05); border: 1px solid rgba(226, 232, 240, 0.8); }

        input, select, textarea { width: 100%; padding: 1.125rem; border: 1.5px solid var(--border); border-radius: 16px; font-family: inherit; font-size: 1rem; transition: all 0.2s; background: #fcfcfd; font-weight: 500; }
        input:focus { border-color: var(--sky-blue); outline: none; background: white; box-shadow: 0 0 0 4px rgba(14, 165, 233, 0.1); }

        #app { display: none; min-height: 100vh; }
        aside { width: 320px; background: white; border-right: 1.5px solid var(--border); padding: 3rem 2rem; position: sticky; top: 0; height: 100vh; }
        main { flex: 1; padding: 4rem; max-width: 1400px; margin: 0 auto; }

        .nav-link { display: flex; align-items: center; gap: 1rem; padding: 1.125rem 1.5rem; border-radius: 16px; color: var(--text-muted); text-decoration: none; font-weight: 700; transition: all 0.2s; margin-bottom: 0.75rem; border: 1.5px solid transparent; }
        .nav-link:hover { background: var(--sky-blue-light); color: var(--sky-blue-deep); }
        .nav-link.active { background: var(--sky-blue-light); color: var(--sky-blue-deep); border-color: rgba(14, 165, 233, 0.1); }

        .card { background: white; border-radius: 24px; padding: 2rem; box-shadow: var(--shadow); border: 1.5px solid var(--border); transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); margin-bottom: 2rem; }
        .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 2rem; margin-bottom: 3.5rem; }
        .client-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1.5rem; }
        .client-card:hover { transform: translateY(-8px); border-color: var(--sky-blue); box-shadow: 0 20px 25px -5px rgba(14, 165, 233, 0.1); cursor: pointer; }

        .badge { padding: 0.5rem 1rem; border-radius: 100px; font-size: 0.75rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; }
        .badge-sky { background: #e0f2fe; color: #0369a1; }
        .badge-red { background: #fee2e2; color: #991b1b; }

        .modal { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 1.5rem; }
        .modal.active { display: flex; animation: fadeIn 0.3s ease; }
        .modal-content { background: white; border-radius: 32px; width: 100%; max-width: 800px; max-height: 90vh; overflow-y: auto; padding: 3rem; position: relative; }

        .asset-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 1.25rem; margin-top: 1.5rem; }
        .asset-item { text-align: center; text-decoration: none; }
        .asset-item img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 18px; border: 2px solid var(--border); transition: all 0.2s; }
        .asset-item:hover img { border-color: var(--sky-blue); transform: scale(1.05); }
        .asset-name { font-size: 0.75rem; font-weight: 700; color: var(--text-dark); margin-top: 0.75rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        @media (max-width: 1024px) {
            aside { display: none; }
            main { padding: 2rem; }
            .stat-grid { grid-template-columns: 1fr; }
            .auth-card { padding: 2.5rem; }
        }
    </style>
</head>
<body>
    <div id="loader">
        <div class="spinner"></div>
        <p style="font-weight: 700; color: var(--sky-blue-deep); font-family: 'Outfit'; letter-spacing: 1px;">SYNCING QS ECOSYSTEM...</p>
    </div>

    <div id="auth-gate">
        <div class="auth-card">
            <div class="qs-logo">QS</div>
            <div id="gate-options" style="text-align: center;">
                <h2 style="font-size: 2rem; margin-bottom: 0.75rem;">Command Center</h2>
                <p style="color: var(--text-muted); font-weight: 600; margin-bottom: 2.5rem;">Secure access for the QS Network</p>
                <div style="display: grid; gap: 1rem;">
                    <button class="btn btn-sky" onclick="app.showLogin('coach')" style="justify-content: center; padding: 1.25rem;">Coach Entry</button>
                    <button class="btn btn-secondary" onclick="app.showLogin('client')" style="justify-content: center; padding: 1.25rem;">Partner Portal</button>
                </div>
            </div>
            <form id="gate-login" class="hidden" onsubmit="app.handleAuth(event)">
                <h2 style="font-size: 1.75rem; margin-bottom: 2rem; text-align: center;">Identity Verification</h2>
                <div style="margin-bottom: 1.25rem;">
                    <label style="display: block; margin-bottom: 0.5rem; font-size: 0.85rem; font-weight: 800; color: var(--text-muted); text-transform: uppercase;">Official Phone</label>
                    <input type="tel" id="phone" placeholder="Enter phone number" required>
                </div>
                <div style="margin-bottom: 2.5rem;">
                    <label style="display: block; margin-bottom: 0.5rem; font-size: 0.85rem; font-weight: 800; color: var(--text-muted); text-transform: uppercase;">Access Key</label>
                    <input type="password" id="pass" placeholder="Enter security key" required>
                </div>
                <button type="submit" class="btn btn-sky" style="width: 100%; justify-content: center; padding: 1.25rem;">Secure Access</button>
                <button type="button" onclick="location.reload()" style="display: block; width: 100%; background: none; border: none; margin-top: 1.5rem; color: var(--text-muted); font-weight: 700; cursor: pointer;">← Switch Mode</button>
            </form>
        </div>
    </div>

    <div id="app">
        <aside>
            <div class="qs-logo qs-logo-sm">QS</div>
            <nav style="margin-top: 4rem;">
                <a href="#" id="nav-dashboard" class="nav-link active" onclick="app.setView('dashboard')"><i data-lucide="layout-grid"></i> HQ Dashboard</a>
                <a href="#" id="nav-clients" class="nav-link" onclick="app.setView('clients')"><i data-lucide="users"></i> Partner Directory</a>
                <a href="#" id="nav-feedback" class="nav-link" onclick="app.setView('feedback')"><i data-lucide="message-square"></i> Feedback Vault</a>
            </nav>
            <div style="position: absolute; bottom: 3rem; left: 2rem; right: 2rem;">
                <button class="btn btn-sky" onclick="app.showAddClient()" style="width: 100%; justify-content: center;"><i data-lucide="user-plus"></i> New Partner</button>
            </div>
        </aside>
        <main id="view-content"></main>
    </div>

    <!-- Modals -->
    <div id="modal-add-client" class="modal">
        <div class="modal-content">
            <h2 style="font-size: 2.25rem; margin-bottom: 2.5rem;">Initialize New Partner</h2>
            <form onsubmit="app.saveNewClient(event)">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; margin-bottom: 2rem;">
                    <div><label style="font-weight: 800; color: var(--text-muted); text-transform: uppercase; font-size: 0.75rem; display: block; margin-bottom: 0.5rem;">Partner Name</label><input id="n-name" required></div>
                    <div><label style="font-weight: 800; color: var(--text-muted); text-transform: uppercase; font-size: 0.75rem; display: block; margin-bottom: 0.5rem;">Phone Reference</label><input id="n-phone" required></div>
                </div>
                <div style="margin-bottom: 3rem;">
                    <label style="font-weight: 800; color: var(--text-muted); text-transform: uppercase; font-size: 0.75rem; display: block; margin-bottom: 0.5rem;">Current Ecosystem Status</label>
                    <select id="n-status"><option>Lead</option><option>Engaged</option><option>Onboarded</option></select>
                </div>
                <div style="display: flex; gap: 1.5rem; justify-content: flex-end;">
                    <button type="button" class="btn btn-secondary" onclick="app.hideModals()">Cancel</button>
                    <button type="submit" class="btn btn-sky">Deploy Profile</button>
                </div>
            </form>
        </div>
    </div>

    <div id="modal-details" class="modal">
        <div class="modal-content" style="max-width: 900px;">
            <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 4rem;">
                <div id="det-header"></div>
                <button class="btn btn-secondary" onclick="app.hideModals()" style="padding: 0.75rem;"><i data-lucide="x"></i></button>
            </div>
            
            <div style="display: grid; grid-template-columns: 1.5fr 1fr; gap: 4rem;">
                <div>
                    <h3 style="margin-bottom: 2rem; display: flex; align-items: center; gap: 1rem;"><i data-lucide="list-todo" style="color: var(--sky-blue);"></i> Active Missions</h3>
                    <div id="det-tasks"></div>
                    <div style="display: flex; gap: 1rem; margin-top: 2rem;">
                        <input id="det-task" placeholder="Define new mission target...">
                        <button class="btn btn-sky" onclick="app.addTask()" style="padding: 0 1.5rem;">Deploy</button>
                    </div>

                    <h3 style="margin-top: 4.5rem; margin-bottom: 2rem; display: flex; align-items: center; gap: 1rem;"><i data-lucide="history" style="color: var(--sky-blue);"></i> Timeline of Growth</h3>
                    <div id="det-timeline" style="border-left: 2px solid var(--border); padding-left: 2.5rem; margin-left: 0.5rem;"></div>
                </div>
                
                <div>
                    <div class="card" style="background: #f8fafc; border: none; margin-bottom: 2.5rem;">
                        <h3 style="margin-bottom: 1.5rem; font-size: 1.1rem;">Secure Access Key</h3>
                        <div style="display: flex; gap: 0.75rem;">
                            <input id="det-pass" style="background: white;">
                            <button class="btn btn-sky" onclick="app.updatePass()" style="padding: 0 1.25rem;"><i data-lucide="save" style="width: 18px;"></i></button>
                        </div>
                    </div>

                    <h3 style="margin-bottom: 1.5rem; font-size: 1.25rem;">Knowledge Assets</h3>
                    <div id="det-assets" class="asset-list"></div>
                    <label class="btn btn-secondary" style="width: 100%; margin-top: 2rem; cursor: pointer; justify-content: center;"><i data-lucide="upload-cloud"></i> Provision Asset<input type="file" style="display: none;" onchange="app.uploadFile(event, true)"></label>
                    
                    <button class="btn" style="width: 100%; margin-top: 4rem; background: #fff1f2; color: #e11d48; justify-content: center; font-weight: 800;" onclick="app.deleteClient()">Archive Partner</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SB_URL = "https://ivmomvigwanfhwkreqic.supabase.co";
        const SB_KEY = "sb_publishable_5nDWK1EEGa5xWzrKLEqNfw_BNgjFUBp";
        const sb = supabase.createClient(SB_URL, SB_KEY);

        const app = {
            state: { role: null, view: 'dashboard', clients: [], user: null, activeId: null, masterPass: 'spark2024', deferredPrompt: null },
            async init() {
                lucide.createIcons();
                
                window.addEventListener('beforeinstallprompt', (e) => {
                    e.preventDefault();
                    this.state.deferredPrompt = e;
                    this.render(); 
                });

                const { data } = await sb.from('config').select('value').eq('key', 'master_password').maybeSingle();
                if (data) this.state.masterPass = data.value;
                setTimeout(() => {
                    document.getElementById('loader').classList.add('hidden');
                    document.getElementById('auth-gate').style.display = 'flex';
                }, 1800);
            },
            
            async installApp() {
                if (!this.state.deferredPrompt) return;
                this.state.deferredPrompt.prompt();
                const { outcome } = await this.state.deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    this.state.deferredPrompt = null;
                    this.render();
                }
            },

            showLogin(role) {
                this.state.role = role;
                document.getElementById('gate-options').style.display = 'none';
                document.getElementById('gate-login').style.display = 'block';
                if(role === 'client') document.getElementById('client-fields').style.display = 'block';
            },
            async handleAuth(e) {
                e.preventDefault();
                app.toggleLoader(true, "Verifying Portal Access...");
                const phoneInput = document.getElementById('phone').value.trim();
                const phoneDigits = phoneInput.replace(/\D/g, '');
                const phoneSuffix = phoneDigits.slice(-9);
                const pass = document.getElementById('pass').value.trim();
                
                if (this.state.role === 'coach') {
                    // Coach phone: 0711980306 -> suffix: 11980306 (wait, last 9 is 11980306?)
                    // 0711980306 is 10 digits. Last 9 is 711980306.
                    if (pass === this.state.masterPass && phoneSuffix === '711980306') {
                        this.unlock();
                    } else {
                        alert("Invalid Coach Credentials");
                        app.toggleLoader(false);
                    }
                } else {
                    if (phoneDigits.length < 9) {
                        alert("Please enter a valid phone number");
                        app.toggleLoader(false);
                        return;
                    }

                    const { data, error } = await sb.from('clients')
                        .select('*')
                        .ilike('phone', `%${phoneSuffix}%`)
                        .maybeSingle();

                    if (error) {
                        console.error("Auth Error:", error);
                        alert("System sync error. Please try again.");
                        app.toggleLoader(false);
                        return;
                    }

                    if (!data) {
                        alert("Client profile not found. Please check the phone number.");
                        app.toggleLoader(false);
                    } else if (String(data.password).trim() === pass) {
                        this.state.user = data;
                        this.unlock();
                    } else {
                        alert("Incorrect Access Key for this profile.");
                        app.toggleLoader(false);
                    }
                }
            },
            toggleLoader(show, text = "Empowering dreams...") {
                const l = document.getElementById('loader');
                l.querySelector('p').innerText = text;
                if(show) l.classList.remove('hidden');
                else l.classList.add('hidden');
            },
            unlock() {
                document.getElementById('auth-gate').style.display = 'none';
                document.getElementById('app').style.display = 'flex';
                if (this.state.role === 'client') {
                    document.querySelector('aside').style.display = 'none';
                    document.querySelector('main').style.marginLeft = '0';
                }
                this.loadData();
            },
            async loadData() {
                app.toggleLoader(true, "Syncing Command Center...");
                const { data } = await sb.from('clients').select('*').order('name');
                this.state.clients = data || [];
                if (this.state.role === 'client') this.state.user = this.state.clients.find(c => c.id === this.state.user.id);
                this.render();
                setTimeout(() => app.toggleLoader(false), 800);
            },
            setView(v) {
                this.state.view = v;
                document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
                const nav = document.getElementById(`nav-${v}`);
                if (nav) nav.classList.add('active');
                this.render();
            },
            hideModals() { document.querySelectorAll('.modal').forEach(m => m.classList.remove('active')); },
            showAddClient() { this.hideModals(); document.getElementById('modal-add-client').classList.add('active'); },
            async saveNewClient(e) {
                e.preventDefault();
                app.toggleLoader(true, "Initializing Profile...");
                await sb.from('clients').insert({
                    name: document.getElementById('n-name').value,
                    phone: document.getElementById('n-phone').value,
                    status: document.getElementById('n-status').value,
                    password: '1234', history: [], tasks: [], files: []
                });
                this.hideModals(); this.loadData();
            },
            showDetails(id) {
                this.state.activeId = id;
                const c = this.state.clients.find(x => x.id == id);
                document.getElementById('det-header').innerHTML = `
                    <h1 style="font-size: 2.5rem; color: var(--sky-blue-deep);">${c.name}</h1>
                    <p style="font-weight: 700; color: var(--text-muted);">${c.phone} • QS PARTNER</p>
                `;
                document.getElementById('det-pass').value = c.password;
                this.renderDetailsUI(c);
                document.getElementById('modal-details').classList.add('active');
            },
            renderDetailsUI(c) {
                document.getElementById('det-assets').innerHTML = (c.files || []).map(f => `
                    <a href="${f.url}" target="_blank" class="asset-item">
                        <img src="${f.type === 'image' ? f.url : 'https://cdn-icons-png.flaticon.com/512/2306/2306081.png'}">
                        <p class="asset-name">${f.name}</p>
                    </a>
                `).join('');
                document.getElementById('det-tasks').innerHTML = (c.tasks || []).map(t => `
                    <div style="display: flex; align-items: center; gap: 1.25rem; padding: 1.25rem; border: 1.5px solid #f1f5f9; border-radius: 18px; margin-bottom: 0.75rem; background: white; ${t.status === 'done' ? 'opacity: 0.5; text-decoration: line-through;' : ''}">
                        <input type="checkbox" style="width: 22px; height: 22px;" ${t.status === 'done' ? 'checked' : ''} onchange="app.toggleTask(${t.id})">
                        <span style="flex: 1; font-weight: 700; color: var(--text-dark);">${t.title}</span>
                    </div>
                `).join('');
                document.getElementById('det-timeline').innerHTML = (c.history || []).map(h => `
                    <div style="position: relative; padding-bottom: 2rem;">
                        <div style="position: absolute; left: -2.9rem; top: 0.4rem; width: 12px; height: 12px; background: var(--sky-blue); border-radius: 50%; border: 3px solid white; box-shadow: 0 0 0 4px rgba(14, 165, 233, 0.1);"></div>
                        <p style="font-size: 0.75rem; font-weight: 900; color: var(--sky-blue-deep); text-transform: uppercase; margin-bottom: 0.5rem;">${new Date(h.date).toLocaleDateString()}</p>
                        <div style="background: white; padding: 1rem; border-radius: 16px; border: 1.5px solid #f1f5f9; font-weight: 500;">${h.note}</div>
                    </div>
                `).join('');
                lucide.createIcons();
            },
            async uploadFile(e, isCoach = false) {
                const file = e.target.files[0];
                if (!file) return;
                app.toggleLoader(true, "Securing Resource...");
                const targetId = isCoach ? this.state.activeId : this.state.user.id;
                const client = this.state.clients.find(x => x.id == targetId);
                const path = `${targetId}/${Date.now()}_${file.name}`;
                await sb.storage.from('quest-spark').upload(path, file);
                const url = sb.storage.from('quest-spark').getPublicUrl(path).data.publicUrl;
                const files = client.files || [];
                files.unshift({ name: file.name, url, type: file.type.includes('image') ? 'image' : 'file', date: new Date().toISOString() });
                const history = client.history || [];
                history.unshift({ date: new Date().toISOString(), note: `Shared Resource: ${file.name}`, type: 'Asset', from: isCoach ? 'Coach' : 'Client' });
                await sb.from('clients').update({ files, history }).eq('id', targetId);
                await this.loadData(); if (isCoach) this.showDetails(targetId);
            },
            async addTask() {
                const title = document.getElementById('det-task').value;
                if (!title) return;
                const c = this.state.clients.find(x => x.id == this.state.activeId);
                const tasks = c.tasks || [];
                tasks.unshift({ id: Date.now(), title, status: 'pending' });
                await sb.from('clients').update({ tasks }).eq('id', c.id);
                document.getElementById('det-task').value = ''; 
                await this.loadData(); this.showDetails(c.id);
            },
            async toggleTask(tid) {
                const c = this.state.clients.find(x => x.id == this.state.activeId);
                const tasks = c.tasks.map(t => t.id === tid ? {...t, status: t.status === 'done' ? 'pending' : 'done'} : t);
                await sb.from('clients').update({ tasks }).eq('id', c.id);
                await this.loadData(); this.showDetails(c.id);
            },
            async updatePass() {
                await sb.from('clients').update({ password: document.getElementById('det-pass').value }).eq('id', this.state.activeId);
                alert("Key Updated"); this.loadData();
            },
            async deleteClient() {
                if(confirm("Archive this partner profile?")) {
                    app.toggleLoader(true, "Archiving...");
                    await sb.from('clients').delete().eq('id', this.state.activeId);
                    this.hideModals(); this.loadData();
                }
            },
            render() {
                const el = document.getElementById('view-content');
                if (this.state.role === 'client') return this.renderClientPortal(el);
                if (this.state.view === 'dashboard') this.renderDashboard(el);
                if (this.state.view === 'clients') this.renderDirectory(el);
                if (this.state.view === 'feedback') this.renderFeedback(el);
                lucide.createIcons();
            },
            getInstallUI() {
                const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
                if (this.state.deferredPrompt) {
                    return `
                        <div class="card" style="background: linear-gradient(135deg, var(--sky-blue), var(--sky-blue-deep)); color: white; border: none; margin-bottom: 2.5rem; box-shadow: 0 10px 25px -5px rgba(14, 165, 233, 0.4); overflow: hidden; position: relative;">
                            <div style="display: flex; justify-content: space-between; align-items: center; gap: 1.5rem; position: relative; z-index: 2;">
                                <div style="display: flex; align-items: center; gap: 1.5rem;">
                                    <div class="qs-logo qs-logo-sm" style="background: white;">QS</div>
                                    <div>
                                        <h3 style="color: white; font-size: 1.25rem;">🚀 Install QS App</h3>
                                        <p style="opacity: 0.9; font-size: 0.85rem; margin-top: 0.25rem;">Add QS to your home screen for a premium experience.</p>
                                    </div>
                                </div>
                                <button class="btn" style="background: white; color: var(--sky-blue-deep); min-width: 140px; justify-content: center; font-weight: 800;" onclick="app.installApp()">Install Now</button>
                            </div>
                        </div>
                    `;
                } else if (isIOS) {
                    return `
                        <div class="card" style="background: linear-gradient(135deg, #f0f9ff, #e0f2fe); border: 2px solid var(--sky-blue); margin-bottom: 2.5rem; box-shadow: 0 4px 15px rgba(14, 165, 233, 0.1);">
                            <div style="display: flex; gap: 1.5rem; align-items: center;">
                                <div style="background: white; padding: 0.75rem; border-radius: 12px; box-shadow: var(--shadow);"><i data-lucide="apple" style="color: var(--sky-blue); width: 24px; height: 24px;"></i></div>
                                <div>
                                    <h3 style="color: var(--sky-blue-deep); font-weight: 800;">iPhone App Mode</h3>
                                    <p style="color: var(--text-dark); font-size: 0.9rem; margin-top: 0.25rem; font-weight: 600;">Tap <i data-lucide="share" style="width:16px; display:inline; color: var(--sky-blue-deep);"></i> then <b style="color: var(--sky-blue-deep);">"Add to Home Screen"</b></p>
                                </div>
                            </div>
                        </div>
                    `;
                }
                return `
                    <div class="card" style="background: #f8fafc; border: 1px dashed var(--border); margin-bottom: 2.5rem; opacity: 0.8;">
                        <div style="display: flex; gap: 1rem; align-items: center;">
                            <i data-lucide="smartphone" style="color: var(--text-muted);"></i>
                            <p style="font-size: 0.85rem; font-weight: 600; color: var(--text-muted);">App Mode Ready: Check browser menu to "Install" or "Add to Home Screen".</p>
                        </div>
                    </div>
                `;
            },
            renderDashboard(el) {
                el.innerHTML = `
                    ${this.getInstallUI()}
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 3.5rem;">
                        <h1>QS Dashboard</h1>
                        <p style="font-weight: 700; color: var(--sky-blue-deep);">${new Date().toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' })}</p>
                    </div>
                    <div class="stat-grid">
                        <div class="card" style="border-left: 6px solid var(--sky-blue);"><i data-lucide="users" style="color:var(--sky-blue); margin-bottom: 1rem;"></i><h3 style="font-size: 2.5rem;">${this.state.clients.length}</h3><p style="font-weight: 600; color: var(--text-muted);">Total Partners</p></div>
                        <div class="card" style="border-left: 6px solid var(--accent-red);"><i data-lucide="zap" style="color:var(--accent-red); margin-bottom: 1rem;"></i><h3 style="font-size: 2.5rem;">${this.state.clients.filter(c => c.status === 'Onboarded').length}</h3><p style="font-weight: 600; color: var(--text-muted);">Active Ecosystem</p></div>
                    </div>
                    <h2 style="margin-bottom: 2rem;">Quick Partner Access</h2>
                    <div class="client-grid">${this.state.clients.slice(0, 6).map(c => this.cardTpl(c)).join('')}</div>
                `;
                lucide.createIcons();
            },
            renderDirectory(el) {
                el.innerHTML = `<h1>Master QS Directory</h1><div class="client-grid" style="margin-top: 2.5rem;">${this.state.clients.map(c => this.cardTpl(c)).join('')}</div>`;
            },
            renderFeedback(el) {
                const feeds = this.state.clients.flatMap(c => (c.history || []).filter(h => h.from === 'Client').map(h => ({...h, cName: c.name, cId: c.id})));
                el.innerHTML = `<h1>QS Feedback Vault</h1><div style="margin-top: 2.5rem; display: grid; gap: 1.25rem;">${feeds.map(f => `
                    <div class="card" onclick="app.showDetails(${f.cId})" style="cursor:pointer; display: flex; justify-content: space-between; align-items: center; border-left: 4px solid var(--sky-blue);">
                        <div><b style="font-size: 1.1rem;">${f.cName}</b><p style="margin-top: 0.5rem; font-weight: 500;">${f.note}</p></div>
                        <i data-lucide="arrow-right" style="color: var(--sky-blue);"></i>
                    </div>
                `).join('')}</div>`;
            },
            renderClientPortal(el) {
                const c = this.state.user;
                el.innerHTML = `
                    <div style="background: linear-gradient(135deg, var(--sky-blue), var(--sky-blue-deep)); padding: 7rem 5rem; color: white; margin: -3rem -3rem 4rem -3rem; border-radius: 0 0 50px 50px; box-shadow: 0 20px 40px rgba(14, 165, 233, 0.2); position: relative; z-index: 1;">
                        <div style="display: flex; align-items: center; gap: 2rem; margin-bottom: 1rem;">
                            <div class="qs-logo" style="background: white; margin-bottom: 0;">QS</div>
                            <div>
                                <h1 style="font-size: 3.5rem; margin-bottom: 0.25rem; font-family: 'Outfit';">Welcome, ${c.name}</h1>
                                <p style="font-weight: 700; letter-spacing: 2px; opacity: 0.9; text-transform: uppercase;">Official QS Ecosystem Access</p>
                            </div>
                        </div>
                    </div>
                    
                    <div style="position: relative; z-index: 2; margin-top: -2rem;">
                        ${this.getInstallUI()}
                    </div>

                    <div style="display: grid; grid-template-columns: 1.6fr 1fr; gap: 4rem;">
                        <div>
                            <div class="card">
                                <h3 style="margin-bottom: 1.5rem;">QS Interaction Hub</h3>
                                <textarea id="cl-note" rows="5" style="margin-bottom: 1.5rem;" placeholder="Share a breakthrough or update with QS..."></textarea>
                                <div style="display: flex; justify-content: space-between; align-items: center;">
                                    <label class="btn btn-secondary" style="cursor: pointer; background: white; border: 1.5px solid #f1f5f9;"><i data-lucide="paperclip"></i> Attach Resource<input type="file" style="display: none;" onchange="app.uploadFile(event, false)"></label>
                                    <button class="btn btn-sky" onclick="app.postClientNote()">Post Update</button>
                                </div>
                            </div>
                            <div class="card">
                                <h3 style="margin-bottom: 2rem;">The QS Timeline</h3>
                                <div style="margin-top: 1.5rem;">${(c.history || []).map(h => `<div style="padding: 1.25rem; background: #f8fafc; border-radius: 20px; margin-bottom: 1rem; border-left: 5px solid ${h.from === 'Coach' ? 'var(--accent-red)' : 'var(--sky-blue)'};"><small style="font-weight: 900; color: ${h.from === 'Coach' ? 'var(--accent-red)' : 'var(--sky-blue-deep)'}; text-transform: uppercase;">${h.from}</small><p style="margin-top: 0.5rem; font-weight: 600;">${h.note}</p></div>`).join('')}</div>
                            </div>
                        </div>
                        <div>
                            <div class="card" style="border-top: 6px solid var(--sky-blue);">
                                <h3 style="margin-bottom: 1.5rem;">Shared Resources</h3>
                                <div class="asset-list">${(c.files || []).map(f => `<a href="${f.url}" target="_blank" class="asset-item"><img src="${f.type === 'image' ? f.url : 'https://cdn-icons-png.flaticon.com/512/2306/2306081.png'}"><p class="asset-name">${f.name}</p></a>`).join('')}</div>
                            </div>
                            <div class="card" style="background: #f0f9ff; border: none;">
                                <h3 style="margin-bottom: 1.5rem; color: var(--sky-blue-deep);">Your QS Actions</h3>
                                <div>${(c.tasks || []).map(t => `<div style="display: flex; align-items: center; gap: 1rem; padding: 1rem; background: white; border-radius: 14px; margin-bottom: 0.75rem; ${t.status === 'done' ? 'opacity: 0.5;' : ''}"><i data-lucide="${t.status === 'done' ? 'check-circle' : 'circle'}" style="color: var(--sky-blue); width: 20px;"></i><span style="font-weight: 700; font-size: 0.95rem;">${t.title}</span></div>`).join('')}</div>
                            </div>
                            <a href="https://wa.me/254711980306" class="btn btn-wa" style="width: 100%; padding: 1.5rem; font-size: 1.1rem;">Instant WhatsApp QS</a>
                        </div>
                    </div>
                `;
                lucide.createIcons();
            },
            async postClientNote() {
                const note = document.getElementById('cl-note').value;
                if (!note) return;
                app.toggleLoader(true, "Empowering dreams...");
                const history = this.state.user.history || [];
                history.unshift({ date: new Date().toISOString(), note, type: 'Feedback', from: 'Client' });
                await sb.from('clients').update({ history }).eq('id', this.state.user.id);
                document.getElementById('cl-note').value = ''; await this.loadData();
            },
            cardTpl(c) {
                return `<div class="card client-card" onclick="app.showDetails(${c.id})"><div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;"><span class="badge ${c.status === 'Lead' ? 'badge-sky' : 'badge-red'}">${c.status}</span><i data-lucide="external-link" style="width: 18px; color: #cbd5e1;"></i></div><h3 style="font-size: 1.4rem;">${c.name}</h3><p style="color:var(--text-muted); font-size:0.9rem; font-weight: 600; margin-top: 0.25rem;">${c.phone}</p></div>`;
            }
        };
        app.init();
    </script>
</body>
</html>
