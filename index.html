<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quest Spark | Coaching Excellence</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;600;700&display=swap');
        
        :root {
            --bg-main: #f0f9ff;
            --glass: rgba(255, 255, 255, 0.95);
            --accent-red: #8b1e1e;
            --accent-blue: #0284c7;
            --accent-emerald: #059669;
            --text-dark: #0f172a;
            --text-muted: #475569;
            --border: rgba(0, 0, 0, 0.08);
            --shadow: 0 10px 40px rgba(2, 132, 199, 0.05);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--bg-main); color: var(--text-dark); min-height: 100vh; line-height: 1.6; }
        h1, h2, h3 { font-family: 'Outfit', sans-serif; font-weight: 700; }

        /* Auth Gate */
        #auth-gate { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; display: flex; align-items: center; justify-content: center; z-index: 2000; }
        .gate-card { text-align: center; max-width: 400px; width: 100%; padding: 2rem; }

        /* Layout */
        #app { display: none; min-height: 100vh; }
        aside { width: 280px; background: white; border-right: 1px solid var(--border); padding: 2rem; position: fixed; height: 100vh; z-index: 100; }
        main { flex: 1; margin-left: 280px; padding: 3rem; max-width: 1400px; }

        /* Sidebar */
        .logo { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 3rem; color: var(--accent-red); font-size: 1.25rem; }
        .nav-link { display: flex; align-items: center; gap: 1rem; padding: 0.85rem 1rem; color: var(--text-muted); text-decoration: none; border-radius: 12px; margin-bottom: 0.5rem; transition: all 0.2s; font-weight: 500; }
        .nav-link:hover { background: #f8fafc; color: var(--text-dark); }
        .nav-link.active { background: #eff6ff; color: var(--accent-blue); }

        /* UI */
        .card { background: white; border: 1px solid var(--border); border-radius: 24px; padding: 1.5rem; box-shadow: var(--shadow); margin-bottom: 1.5rem; }
        .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.5rem; margin-bottom: 2.5rem; }
        .client-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.5rem; }
        .client-card { transition: all 0.3s; cursor: pointer; border-left: 5px solid transparent; }
        .client-card:hover { transform: translateY(-5px); border-left-color: var(--accent-red); box-shadow: 0 15px 45px rgba(0,0,0,0.08); }

        .btn { padding: 0.8rem 1.5rem; border-radius: 14px; border: none; font-weight: 600; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; gap: 0.5rem; font-family: inherit; font-size: 0.9rem; }
        .btn-primary { background: var(--accent-red); color: white; }
        .btn-secondary { background: #f1f5f9; color: var(--text-dark); }
        .btn-wa { background: #25d366; color: white; text-decoration: none; justify-content: center; }

        /* Modals */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.4); backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center; z-index: 3000; }
        .modal.active { display: flex; }
        .modal-content { background: white; padding: 2.5rem; border-radius: 32px; width: 95%; max-width: 900px; max-height: 90vh; overflow-y: auto; }

        .form-group { margin-bottom: 1.25rem; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.5rem; color: var(--text-muted); }
        input, select, textarea { width: 100%; padding: 0.85rem; border: 1.5px solid #e2e8f0; border-radius: 12px; font-family: inherit; }

        /* Assets */
        .asset-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 1rem; margin-top: 1rem; }
        .asset-item { border: 1px solid #eee; border-radius: 12px; padding: 0.5rem; text-align: center; transition: all 0.2s; position: relative; }
        .asset-item:hover { border-color: var(--accent-blue); transform: scale(1.05); }
        .asset-item img { width: 100%; height: 80px; object-fit: cover; border-radius: 8px; margin-bottom: 0.5rem; }
        .asset-name { font-size: 0.7rem; color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .badge { padding: 0.25rem 0.6rem; border-radius: 6px; font-size: 0.7rem; font-weight: 800; text-transform: uppercase; }
        .badge-blue { background: #e0f2fe; color: #0369a1; }
        .badge-green { background: #dcfce7; color: #15803d; }
    </style>
</head>
<body>

    <!-- Auth Gate -->
    <div id="auth-gate">
        <div class="gate-card">
            <h1 style="color: var(--accent-red); margin-bottom: 2rem;">Quest Spark</h1>
            <div id="gate-options">
                <button class="btn btn-primary" style="width: 100%; margin-bottom: 1rem; justify-content: center;" onclick="app.showLogin('coach')">Coach Portal</button>
                <button class="btn btn-secondary" style="width: 100%; justify-content: center;" onclick="app.showLogin('client')">Client Portal</button>
            </div>
            <div id="gate-login" style="display: none; margin-top: 2rem;">
                <h3 id="login-title">Access Locked</h3>
                <form onsubmit="app.handleAuth(event)">
                    <div id="client-fields" style="display: none;">
                        <input type="text" id="g-phone" placeholder="Phone Number" style="margin-top: 1rem;">
                    </div>
                    <input type="password" id="g-pass" placeholder="Password" style="margin: 1rem 0;" required>
                    <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center;">Unlock</button>
                    <button type="button" class="btn btn-secondary" style="width: 100%; margin-top: 1rem; justify-content: center;" onclick="location.reload()">Back</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Main App -->
    <div id="app">
        <aside>
            <div class="logo"><b>Quest Spark</b></div>
            <nav>
                <a href="#" class="nav-link active" id="nav-dashboard" onclick="app.setView('dashboard')"><i data-lucide="layout-dashboard"></i> Dashboard</a>
                <a href="#" class="nav-link" id="nav-clients" onclick="app.setView('clients')"><i data-lucide="users"></i> Directory</a>
                <a href="#" class="nav-link" id="nav-feedback" onclick="app.setView('feedback')"><i data-lucide="message-square"></i> Feedback Hub</a>
                <div style="margin-top: 2rem; border-top: 1px solid #eee; padding-top: 2rem;">
                    <button class="btn btn-primary" style="width: 100%;" onclick="app.showAddClient()">+ New Client</button>
                </div>
            </nav>
            <button class="btn btn-secondary" style="width: 100%; margin-top: auto;" onclick="location.reload()">Logout</button>
        </aside>
        
        <main>
            <div id="view-content"></div>
        </main>
    </div>

    <!-- Details Modal (The Upgraded End) -->
    <div id="modal-details" class="modal">
        <div class="modal-content">
            <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 2.5rem;">
                <div id="det-header"></div>
                <button class="btn btn-secondary" onclick="app.hideModals()">Close</button>
            </div>
            
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 3rem;">
                <div>
                    <h3>Shared Asset Vault</h3>
                    <div style="margin: 1rem 0;">
                        <label class="btn btn-secondary" style="width: 100%; justify-content: center; cursor: pointer;">
                            <i data-lucide="upload-cloud"></i> Share File/Image
                            <input type="file" style="display: none;" onchange="app.uploadFile(event, true)">
                        </label>
                    </div>
                    <div id="det-assets" class="asset-list"></div>
                    
                    <h3 style="margin-top: 3rem;">Session History</h3>
                    <div id="det-timeline" style="margin-top: 1rem;"></div>
                </div>
                <div>
                    <h3>Homework Tracker</h3>
                    <div style="margin: 1rem 0; display: flex; gap: 0.5rem;">
                        <input type="text" id="det-task" placeholder="Assign homework...">
                        <button class="btn btn-primary" onclick="app.addTask()">Assign</button>
                    </div>
                    <div id="det-tasks"></div>
                    
                    <div class="card" style="margin-top: 3rem; background: #f8fafc;">
                        <h3>Account Actions</h3>
                        <p style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 1rem;">Update password or delete record</p>
                        <div class="form-group"><label>Password</label><input type="text" id="det-pass"></div>
                        <div style="display: flex; gap: 0.5rem;">
                            <button class="btn btn-primary" style="flex: 1;" onclick="app.updatePass()">Save</button>
                            <button class="btn btn-secondary" style="background: #fee2e2; color: #991b1b;" onclick="app.deleteClient()">Delete</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- New Client Modal -->
    <div id="modal-add-client" class="modal">
        <div class="modal-content" style="max-width: 450px;">
            <h2>Onboard Client</h2>
            <form onsubmit="app.saveNewClient(event)">
                <div class="form-group"><label>Name</label><input type="text" id="n-name" required></div>
                <div class="form-group"><label>Phone</label><input type="text" id="n-phone" required></div>
                <div class="form-group"><label>Status</label><select id="n-status"><option value="Lead">Lead</option><option value="Onboarded">Onboarded</option></select></div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Create Account</button>
                <button type="button" class="btn btn-secondary" style="width: 100%; margin-top: 1rem;" onclick="app.hideModals()">Cancel</button>
            </form>
        </div>
    </div>

    <script>
        const SB_URL = "https://ivmomvigwanfhwkreqic.supabase.co";
        const SB_KEY = "sb_publishable_5nDWK1EEGa5xWzrKLEqNfw_BNgjFUBp";
        const sb = supabase.createClient(SB_URL, SB_KEY);

        const app = {
            state: { role: null, view: 'dashboard', clients: [], user: null, activeId: null, masterPass: 'spark2024' },
            
            async init() {
                lucide.createIcons();
                const { data } = await sb.from('config').select('value').eq('key', 'master_password').maybeSingle();
                if (data) this.state.masterPass = data.value;
            },

            showLogin(role) {
                this.state.role = role;
                document.getElementById('gate-options').style.display = 'none';
                document.getElementById('gate-login').style.display = 'block';
                if(role === 'client') document.getElementById('client-fields').style.display = 'block';
            },

            async handleAuth(e) {
                e.preventDefault();
                const pass = document.getElementById('g-pass').value;
                if (this.state.role === 'coach') {
                    if (pass === this.state.masterPass || pass === 'spark2024') this.unlock();
                    else alert("Wrong Password");
                } else {
                    const phone = document.getElementById('g-phone').value;
                    const { data } = await sb.from('clients').select('*').ilike('phone', `%${phone.slice(-9)}`).maybeSingle();
                    if (data && String(data.password) === String(pass)) {
                        this.state.user = data; this.unlock();
                    } else alert("Denied");
                }
            },

            unlock() {
                document.getElementById('auth-gate').style.display = 'none';
                document.getElementById('app').style.display = 'flex';
                if (this.state.role === 'client') {
                    document.querySelector('aside').style.display = 'none';
                    document.querySelector('main').style.marginLeft = '0';
                }
                this.loadData();
            },

            async loadData() {
                const { data } = await sb.from('clients').select('*').order('name');
                this.state.clients = data || [];
                if (this.state.role === 'client') this.state.user = this.state.clients.find(c => c.id === this.state.user.id);
                this.render();
            },

            setView(v) {
                this.state.view = v;
                document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
                const nav = document.getElementById(`nav-${v}`);
                if (nav) nav.classList.add('active');
                this.render();
            },

            hideModals() { document.querySelectorAll('.modal').forEach(m => m.classList.remove('active')); },
            showAddClient() { this.hideModals(); document.getElementById('modal-add-client').classList.add('active'); },

            async saveNewClient(e) {
                e.preventDefault();
                await sb.from('clients').insert({
                    name: document.getElementById('n-name').value,
                    phone: document.getElementById('n-phone').value,
                    status: document.getElementById('n-status').value,
                    industry: 'General', password: '1234', history: [], tasks: [], files: []
                });
                this.hideModals(); this.loadData();
            },

            showDetails(id) {
                this.state.activeId = id;
                const c = this.state.clients.find(x => x.id == id);
                document.getElementById('det-header').innerHTML = `<h2>${c.name}</h2><p>${c.phone}</p>`;
                document.getElementById('det-pass').value = c.password;
                this.renderDetailsUI(c);
                document.getElementById('modal-details').classList.add('active');
            },

            renderDetailsUI(c) {
                document.getElementById('det-assets').innerHTML = (c.files || []).map(f => `
                    <a href="${f.url}" target="_blank" class="asset-item">
                        <img src="${f.type === 'image' ? f.url : 'https://cdn-icons-png.flaticon.com/512/2306/2306081.png'}" onerror="this.src='https://cdn-icons-png.flaticon.com/512/2306/2306081.png'">
                        <p class="asset-name">${f.name}</p>
                    </a>
                `).join('');
                document.getElementById('det-tasks').innerHTML = (c.tasks || []).map(t => `
                    <div style="display: flex; align-items: center; gap: 1rem; padding: 0.8rem; border: 1px solid #eee; border-radius: 12px; margin-bottom: 0.5rem; ${t.status === 'done' ? 'opacity: 0.5; text-decoration: line-through;' : ''}">
                        <input type="checkbox" ${t.status === 'done' ? 'checked' : ''} onchange="app.toggleTask(${t.id})">
                        <span style="flex: 1; font-weight: 600;">${t.title}</span>
                    </div>
                `).join('');
                document.getElementById('det-timeline').innerHTML = (c.history || []).map(h => `<p style="font-size: 0.8rem; padding: 0.5rem; border-bottom: 1px solid #f1f5f9;"><b>${new Date(h.date).toLocaleDateString()}:</b> ${h.note}</p>`).join('');
                lucide.createIcons();
            },

            async uploadFile(e, isCoach = false) {
                const file = e.target.files[0];
                if (!file) return;
                const targetId = isCoach ? this.state.activeId : this.state.user.id;
                const client = this.state.clients.find(x => x.id == targetId);
                const path = `${targetId}/${Date.now()}_${file.name}`;
                
                const { data, error } = await sb.storage.from('quest-spark').upload(path, file);
                if (error) { alert("Bucket 'quest-spark' not found. Please create it in Supabase Storage."); return; }
                
                const url = sb.storage.from('quest-spark').getPublicUrl(path).data.publicUrl;
                const files = client.files || [];
                files.unshift({ name: file.name, url, type: file.type.includes('image') ? 'image' : 'file', date: new Date().toISOString() });
                
                const history = client.history || [];
                history.unshift({ date: new Date().toISOString(), note: `Shared ${file.name}`, type: 'Asset', from: isCoach ? 'Coach' : 'Client' });
                
                await sb.from('clients').update({ files, history }).eq('id', targetId);
                this.loadData();
                if (isCoach) this.showDetails(targetId);
            },

            async addTask() {
                const title = document.getElementById('det-task').value;
                if (!title) return;
                const c = this.state.clients.find(x => x.id == this.state.activeId);
                const tasks = c.tasks || [];
                tasks.unshift({ id: Date.now(), title, status: 'pending' });
                await sb.from('clients').update({ tasks }).eq('id', c.id);
                document.getElementById('det-task').value = ''; this.loadData(); this.showDetails(c.id);
            },

            async toggleTask(tid) {
                const c = this.state.clients.find(x => x.id == this.state.activeId);
                const tasks = c.tasks.map(t => t.id === tid ? {...t, status: t.status === 'done' ? 'pending' : 'done'} : t);
                await sb.from('clients').update({ tasks }).eq('id', c.id);
                this.loadData(); this.showDetails(c.id);
            },

            async updatePass() {
                await sb.from('clients').update({ password: document.getElementById('det-pass').value }).eq('id', this.state.activeId);
                alert("Password Updated"); this.loadData();
            },

            async deleteClient() {
                if(confirm("Permanently delete?")) {
                    await sb.from('clients').delete().eq('id', this.state.activeId);
                    this.hideModals(); this.loadData();
                }
            },

            render() {
                const el = document.getElementById('view-content');
                if (this.state.role === 'client') return this.renderClientPortal(el);
                
                if (this.state.view === 'dashboard') this.renderDashboard(el);
                if (this.state.view === 'clients') this.renderDirectory(el);
                if (this.state.view === 'feedback') this.renderFeedback(el);
                lucide.createIcons();
            },

            renderDashboard(el) {
                const leads = this.state.clients.filter(c => c.status === 'Lead').length;
                const onboarded = this.state.clients.filter(c => c.status === 'Onboarded').length;
                el.innerHTML = `
                    <h1 style="margin-bottom: 2rem;">Overview</h1>
                    <div class="stat-grid">
                        <div class="card"><h3>${this.state.clients.length}</h3><p>Total Database</p></div>
                        <div class="card"><h3 style="color: var(--accent-blue)">${leads}</h3><p>Leads</p></div>
                        <div class="card"><h3 style="color: var(--accent-emerald)">${onboarded}</h3><p>Onboarded</p></div>
                    </div>
                    <h2>Quick Access</h2>
                    <div class="client-grid" style="margin-top: 1.5rem;">${this.state.clients.slice(0, 6).map(c => this.cardTpl(c)).join('')}</div>
                `;
            },

            renderDirectory(el) {
                el.innerHTML = `<h1>Client Directory</h1><div class="client-grid" style="margin-top: 2rem;">${this.state.clients.map(c => this.cardTpl(c)).join('')}</div>`;
            },

            renderFeedback(el) {
                const feeds = this.state.clients.flatMap(c => (c.history || []).filter(h => h.from === 'Client').map(h => ({...h, cName: c.name, cId: c.id})));
                el.innerHTML = `<h1>Feedback Inbox</h1><div style="margin-top: 2rem;">${feeds.map(f => `
                    <div class="card" onclick="app.showDetails(${f.cId})" style="cursor:pointer; border-left: 5px solid var(--accent-blue);">
                        <b>${f.cName}</b> • <small>${new Date(f.date).toLocaleDateString()}</small>
                        <p style="margin-top: 0.5rem;">${f.note}</p>
                    </div>
                `).join('')}</div>`;
            },

            renderClientPortal(el) {
                const c = this.state.user;
                el.innerHTML = `
                    <div style="background: var(--accent-red); padding: 5rem 3rem; color: white; margin: -3rem -3rem 3rem -3rem;">
                        <h1>Hello, ${c.name}</h1>
                        <p>Your Private Journey Hub</p>
                    </div>
                    <div style="display: grid; grid-template-columns: 2fr 1.2fr; gap: 2rem;">
                        <div>
                            <div class="card">
                                <h3>Send Update</h3>
                                <textarea id="cl-note" rows="3" style="margin: 1rem 0;" placeholder="Tell your coach something..."></textarea>
                                <div style="display: flex; justify-content: space-between;">
                                    <label class="btn btn-secondary" style="cursor: pointer;">
                                        <i data-lucide="image"></i> Share Image/File
                                        <input type="file" style="display: none;" onchange="app.uploadFile(event, false)">
                                    </label>
                                    <button class="btn btn-primary" onclick="app.postClientNote()">Post</button>
                                </div>
                            </div>
                            <div class="card">
                                <h3>Timeline</h3>
                                <div style="margin-top: 1.5rem;">${(c.history || []).map(h => `<p style="padding: 0.5rem; border-bottom: 1px solid #f1f5f9;">${h.note}</p>`).join('')}</div>
                            </div>
                        </div>
                        <div>
                            <div class="card">
                                <h3>Shared Assets</h3>
                                <div class="asset-list">${(c.files || []).map(f => `
                                    <a href="${f.url}" target="_blank" class="asset-item">
                                        <img src="${f.type === 'image' ? f.url : 'https://cdn-icons-png.flaticon.com/512/2306/2306081.png'}">
                                        <p class="asset-name">${f.name}</p>
                                    </a>
                                `).join('')}</div>
                            </div>
                            <a href="https://wa.me/254711980306" class="btn btn-wa" style="width: 100%; margin-top: 1rem;">Message Coach</a>
                        </div>
                    </div>
                `;
            },

            async postClientNote() {
                const note = document.getElementById('cl-note').value;
                if (!note) return;
                const history = this.state.user.history || [];
                history.unshift({ date: new Date().toISOString(), note, type: 'Feedback', from: 'Client' });
                await sb.from('clients').update({ history }).eq('id', this.state.user.id);
                document.getElementById('cl-note').value = ''; this.loadData();
            },

            cardTpl(c) {
                return `<div class="card client-card" onclick="app.showDetails(${c.id})">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 1rem;">
                        <span class="badge ${c.status === 'Lead' ? 'badge-blue' : 'badge-green'}">${c.status}</span>
                        <i data-lucide="arrow-right" style="width: 16px;"></i>
                    </div>
                    <h3>${c.name}</h3>
                    <p style="color: var(--text-muted); font-size: 0.8rem;">${c.industry}</p>
                </div>`;
            }
        };

        app.init();
    </script>
</body>
</html>
