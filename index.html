<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quest Spark | Collaborative Coaching CRM</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;600;700&display=swap');
        
        :root {
            --bg-main: #f0f9ff;
            --glass: rgba(255, 255, 255, 0.85);
            --accent-red: #8b1e1e;
            --accent-blue: #0284c7;
            --accent-emerald: #059669;
            --text-dark: #0f172a;
            --text-muted: #475569;
            --border: rgba(0, 0, 0, 0.1);
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--bg-main); color: var(--text-dark); min-height: 100vh; line-height: 1.6; }
        h1, h2, h3 { font-family: 'Outfit', sans-serif; font-weight: 700; }

        /* Auth Gate */
        #auth-gate { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
            display: flex; align-items: center; justify-content: center; z-index: 2000;
        }
        .gate-card { background: white; padding: 3rem; border-radius: 32px; width: 100%; max-width: 450px; text-align: center; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.1); }

        /* Layout */
        #app { display: none; min-height: 100vh; }
        aside { width: 280px; background: white; border-right: 1px solid var(--border); padding: 2rem; position: fixed; height: 100vh; z-index: 100; }
        main { flex: 1; margin-left: 280px; padding: 3rem; max-width: 1400px; }

        /* Navigation */
        .logo { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 3rem; color: var(--accent-red); font-size: 1.25rem; }
        .nav-link { display: flex; align-items: center; gap: 1rem; padding: 0.75rem 1rem; color: var(--text-muted); text-decoration: none; border-radius: 12px; margin-bottom: 0.5rem; transition: all 0.2s; font-weight: 500; }
        .nav-link:hover { background: #f8fafc; color: var(--text-dark); }
        .nav-link.active { background: #eff6ff; color: var(--accent-blue); }

        /* Cards */
        .card { background: var(--glass); backdrop-filter: blur(12px); border: 1px solid var(--border); border-radius: 20px; padding: 1.5rem; box-shadow: var(--shadow); margin-bottom: 1.5rem; }
        .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.5rem; margin-bottom: 2.5rem; }
        .client-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1.5rem; }
        .client-card { transition: all 0.3s; border-left: 5px solid transparent; cursor: pointer; }
        .client-card:hover { transform: translateY(-4px); box-shadow: 0 12px 40px rgba(0,0,0,0.1); }

        /* Buttons */
        .btn { padding: 0.75rem 1.5rem; border-radius: 12px; border: none; font-weight: 600; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; gap: 0.5rem; font-family: inherit; font-size: 0.9rem; }
        .btn-primary { background: var(--accent-red); color: white; }
        .btn-secondary { background: #f1f5f9; color: var(--text-dark); }
        .btn-wa { background: #25d366; color: white; text-decoration: none; justify-content: center; }

        /* Modals */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.4); backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center; z-index: 3000; }
        .modal.active { display: flex; }
        .modal-content { background: white; padding: 2.5rem; border-radius: 28px; width: 95%; max-width: 800px; max-height: 90vh; overflow-y: auto; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.3); }

        .form-group { margin-bottom: 1.25rem; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.5rem; color: var(--text-muted); }
        input, select, textarea { width: 100%; padding: 0.85rem; border: 1.5px solid #e2e8f0; border-radius: 12px; font-family: inherit; }

        /* Timeline & Tasks */
        .timeline { border-left: 2px solid #e2e8f0; padding-left: 1.5rem; margin-left: 0.5rem; }
        .timeline-item { margin-bottom: 1.5rem; position: relative; }
        .timeline-item::before { content: ''; width: 10px; height: 10px; background: var(--accent-red); border-radius: 50%; position: absolute; left: -1.9rem; top: 0.5rem; border: 2px solid white; }
        
        .task-row { display: flex; align-items: center; gap: 1rem; padding: 0.8rem; background: #f8fafc; border-radius: 12px; margin-bottom: 0.5rem; border: 1px solid #eee; }
        .task-row.done { opacity: 0.6; text-decoration: line-through; }

        .badge { padding: 0.25rem 0.6rem; border-radius: 6px; font-size: 0.7rem; font-weight: 800; text-transform: uppercase; }
        .badge-feedback { background: #fef3c7; color: #92400e; }
        .badge-session { background: #dcfce7; color: #166534; }

        @media print { aside, .btn, .modal { display: none !important; } main { margin-left: 0 !important; padding: 0 !important; } }
    </style>
</head>
<body>

    <!-- Auth Gate -->
    <div id="auth-gate">
        <div class="gate-card">
            <h1 style="color: var(--accent-red); margin-bottom: 2rem;">Quest Spark</h1>
            <div id="gate-options" style="display: flex; flex-direction: column; gap: 1rem;">
                <button class="btn btn-primary" onclick="app.prepLogin('coach')" style="justify-content: center;">Coach Portal</button>
                <button class="btn btn-secondary" onclick="app.prepLogin('client')" style="justify-content: center;">Client Portal</button>
            </div>
            <div id="gate-login" style="display: none;">
                <h3 id="gate-title">Login</h3>
                <form onsubmit="app.handleAuth(event)">
                    <div id="cl-fields" style="display: none;">
                        <input type="text" id="g-phone" placeholder="Phone Number" style="margin-top: 1rem;">
                    </div>
                    <input type="password" id="g-pass" placeholder="Password" style="margin: 1rem 0;" required>
                    <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center;">Unlock</button>
                    <button type="button" class="btn btn-secondary" style="width: 100%; margin-top: 1rem; justify-content: center;" onclick="location.reload()">Back</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Main App -->
    <div id="app">
        <aside>
            <div class="logo"><b>Quest Spark</b></div>
            <nav>
                <a href="#" class="nav-link active" id="nav-dashboard" onclick="app.setView('dashboard')"><i data-lucide="layout-dashboard"></i> Dashboard</a>
                <a href="#" class="nav-link" id="nav-clients" onclick="app.setView('clients')"><i data-lucide="users"></i> Clients</a>
                <a href="#" class="nav-link" id="nav-reports" onclick="app.setView('reports')"><i data-lucide="bar-chart-3"></i> Reports</a>
                <div style="margin-top: 2rem; border-top: 1px solid #eee; padding-top: 2rem;">
                    <button class="btn btn-primary" style="width: 100%;" onclick="app.showAddClient()">+ New Client</button>
                </div>
            </nav>
            <button class="btn btn-secondary" style="width: 100%; margin-top: auto;" onclick="location.reload()">Logout</button>
        </aside>
        
        <main>
            <div id="view-content"></div>
        </main>
    </div>

    <!-- Client Details Modal (The Improved End) -->
    <div id="modal-details" class="modal">
        <div class="modal-content">
            <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 2rem;">
                <div id="det-header"></div>
                <button class="btn btn-secondary" onclick="app.hideModals()">Close</button>
            </div>
            
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 2rem;">
                <div>
                    <h3>Timeline & Updates</h3>
                    <div style="margin: 1rem 0; display: flex; gap: 0.5rem;">
                        <input type="text" id="det-note" placeholder="Quick Session Note...">
                        <button class="btn btn-primary" onclick="app.addDetNote()">Post</button>
                    </div>
                    <div id="det-timeline" class="timeline"></div>
                </div>
                <div>
                    <h3>Pending Tasks</h3>
                    <div style="margin: 1rem 0; display: flex; gap: 0.5rem;">
                        <input type="text" id="det-task" placeholder="Assign Homework...">
                        <button class="btn btn-secondary" onclick="app.addDetTask()">Assign</button>
                    </div>
                    <div id="det-tasks"></div>
                    
                    <div class="card" style="margin-top: 2rem;">
                        <h3>Account Settings</h3>
                        <div class="form-group" style="margin-top: 1rem;"><label>Sector</label><input type="text" id="det-industry"></div>
                        <div class="form-group"><label>Portal Password</label><input type="text" id="det-pass"></div>
                        <button class="btn btn-primary" style="width: 100%;" onclick="app.updateDetClient()">Save Changes</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- New Client Modal -->
    <div id="modal-add-client" class="modal">
        <div class="modal-content" style="max-width: 450px;">
            <h2>Onboard New Client</h2>
            <form onsubmit="app.saveNewClient(event)">
                <div class="form-group"><label>Name</label><input type="text" id="n-name" required></div>
                <div class="form-group"><label>Sector</label><input type="text" id="n-industry" required></div>
                <div class="form-group"><label>Phone</label><input type="text" id="n-phone" required></div>
                <div class="form-group"><label>Initial Status</label><select id="n-status"><option value="Lead">Lead</option><option value="Onboarded">Onboarded</option></select></div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Create Account</button>
                <button type="button" class="btn btn-secondary" style="width: 100%; margin-top: 1rem;" onclick="app.hideModals()">Cancel</button>
            </form>
        </div>
    </div>

    <script>
        const SB_URL = "https://ivmomvigwanfhwkreqic.supabase.co";
        const SB_KEY = "sb_publishable_5nDWK1EEGa5xWzrKLEqNfw_BNgjFUBp";
        const sb = supabase.createClient(SB_URL, SB_KEY);

        const app = {
            state: { role: null, view: 'dashboard', clients: [], user: null, activeId: null, masterPass: 'spark2024' },
            
            async init() {
                lucide.createIcons();
                const { data } = await sb.from('config').select('value').eq('key', 'master_password').maybeSingle();
                if (data) this.state.masterPass = data.value;
            },

            prepLogin(role) {
                this.state.role = role;
                document.getElementById('gate-options').style.display = 'none';
                document.getElementById('gate-login').style.display = 'block';
                document.getElementById('gate-title').innerText = role === 'coach' ? 'Coach Access' : 'Client Access';
                if(role === 'client') document.getElementById('cl-fields').style.display = 'block';
            },

            async handleAuth(e) {
                e.preventDefault();
                const pass = document.getElementById('g-pass').value;
                if (this.state.role === 'coach') {
                    if (pass === this.state.masterPass || pass === 'spark2024') this.unlock();
                    else alert("Invalid Password");
                } else {
                    const phone = document.getElementById('g-phone').value;
                    const { data } = await sb.from('clients').select('*').ilike('phone', `%${phone.slice(-9)}`).maybeSingle();
                    if (data && String(data.password) === String(pass)) {
                        this.state.user = data;
                        this.unlock();
                    } else alert("Access Denied");
                }
            },

            unlock() {
                document.getElementById('auth-gate').style.display = 'none';
                document.getElementById('app').style.display = 'flex';
                if (this.state.role === 'client') {
                    document.querySelector('aside').style.display = 'none';
                    document.querySelector('main').style.marginLeft = '0';
                }
                this.loadData();
            },

            async loadData() {
                const { data } = await sb.from('clients').select('*').order('name');
                this.state.clients = data || [];
                if (this.state.role === 'client') this.state.user = this.state.clients.find(c => c.id === this.state.user.id);
                this.render();
            },

            setView(v) {
                this.state.view = v;
                document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
                const nav = document.getElementById(`nav-${v}`);
                if (nav) nav.classList.add('active');
                this.render();
            },

            hideModals() { document.querySelectorAll('.modal').forEach(m => m.classList.remove('active')); },
            showAddClient() { this.hideModals(); document.getElementById('modal-add-client').classList.add('active'); },

            async saveNewClient(e) {
                e.preventDefault();
                const obj = {
                    name: document.getElementById('n-name').value,
                    industry: document.getElementById('n-industry').value,
                    phone: document.getElementById('n-phone').value,
                    status: document.getElementById('n-status').value,
                    password: '1234', history: [], tasks: [], files: []
                };
                await sb.from('clients').insert(obj);
                this.hideModals(); this.loadData();
            },

            // The Improved Details Logic
            showDetails(id) {
                this.state.activeId = id;
                const c = this.state.clients.find(x => x.id == id);
                document.getElementById('det-header').innerHTML = `
                    <h2 style="font-size: 2rem;">${c.name}</h2>
                    <p style="color: var(--text-muted);">${c.phone}</p>
                `;
                document.getElementById('det-industry').value = c.industry;
                document.getElementById('det-pass').value = c.password;
                this.renderDetailsUI(c);
                document.getElementById('modal-details').classList.add('active');
            },

            renderDetailsUI(c) {
                const timeline = document.getElementById('det-timeline');
                timeline.innerHTML = (c.history || []).map(h => `
                    <div class="timeline-item">
                        <div style="font-size: 0.75rem; color: var(--accent-blue); font-weight: 700;">${new Date(h.date).toLocaleDateString()}</div>
                        <p style="background: #f8fafc; padding: 0.75rem; border-radius: 8px; margin-top: 0.25rem;">${h.note}</p>
                    </div>
                `).join('');

                const tasks = document.getElementById('det-tasks');
                tasks.innerHTML = (c.tasks || []).map(t => `
                    <div class="task-row ${t.status === 'done' ? 'done' : ''}">
                        <input type="checkbox" ${t.status === 'done' ? 'checked' : ''} onchange="app.toggleDetTask(${t.id})">
                        <span style="flex: 1;">${t.title}</span>
                        <button onclick="app.deleteDetTask(${t.id})" style="border:none; background:none; color:red; cursor:pointer;"><i data-lucide="trash" style="width:14px;"></i></button>
                    </div>
                `).join('');
                lucide.createIcons();
            },

            async addDetNote() {
                const note = document.getElementById('det-note').value;
                if (!note) return;
                const c = this.state.clients.find(x => x.id == this.state.activeId);
                const history = c.history || [];
                history.unshift({ date: new Date().toISOString(), note, type: 'Session', from: 'Coach' });
                await sb.from('clients').update({ history }).eq('id', c.id);
                document.getElementById('det-note').value = '';
                this.loadData();
                this.showDetails(c.id);
            },

            async addDetTask() {
                const title = document.getElementById('det-task').value;
                if (!title) return;
                const c = this.state.clients.find(x => x.id == this.state.activeId);
                const tasks = c.tasks || [];
                tasks.unshift({ id: Date.now(), title, status: 'pending' });
                await sb.from('clients').update({ tasks }).eq('id', c.id);
                document.getElementById('det-task').value = '';
                this.loadData();
                this.showDetails(c.id);
            },

            async toggleDetTask(tid) {
                const c = this.state.clients.find(x => x.id == this.state.activeId);
                const tasks = c.tasks.map(t => t.id === tid ? {...t, status: t.status === 'done' ? 'pending' : 'done'} : t);
                await sb.from('clients').update({ tasks }).eq('id', c.id);
                this.loadData();
                this.showDetails(c.id);
            },

            async updateDetClient() {
                const industry = document.getElementById('det-industry').value;
                const password = document.getElementById('det-pass').value;
                await sb.from('clients').update({ industry, password }).eq('id', this.state.activeId);
                this.loadData();
                alert("Settings Updated!");
            },

            render() {
                const el = document.getElementById('view-content');
                if (this.state.role === 'client') return this.renderClientPortal(el);
                
                if (this.state.view === 'dashboard') this.renderDashboard(el);
                if (this.state.view === 'clients') this.renderDirectory(el);
                if (this.state.view === 'reports') this.renderReports(el);
                lucide.createIcons();
            },

            renderDashboard(el) {
                const leads = this.state.clients.filter(c => c.status === 'Lead').length;
                const onboarded = this.state.clients.filter(c => c.status === 'Onboarded').length;
                el.innerHTML = `
                    <h1 style="margin-bottom: 2rem;">Overview</h1>
                    <div class="stat-grid">
                        <div class="card"><h3>${this.state.clients.length}</h3><p>Total Database</p></div>
                        <div class="card"><h3 style="color: var(--accent-blue)">${leads}</h3><p>Active Leads</p></div>
                        <div class="card"><h3 style="color: var(--accent-emerald)">${onboarded}</h3><p>Onboarded</p></div>
                    </div>
                    <h2>Quick Links</h2>
                    <div class="client-grid" style="margin-top: 1.5rem;">${this.state.clients.slice(0, 6).map(c => this.cardTpl(c)).join('')}</div>
                `;
            },

            renderDirectory(el) {
                el.innerHTML = `<h1>Full Directory</h1><div class="client-grid" style="margin-top: 2rem;">${this.state.clients.map(c => this.cardTpl(c)).join('')}</div>`;
            },

            renderReports(el) {
                el.innerHTML = `
                    <div style="display: flex; justify-content: space-between; margin-bottom: 2rem;">
                        <h1>Activity Log</h1>
                        <button class="btn btn-primary" onclick="window.print()">Export Log</button>
                    </div>
                    <div class="card">
                        <table style="width: 100%; text-align: left;">
                            <tr style="border-bottom: 2px solid #eee;"><th style="padding: 1rem;">Client</th><th style="padding: 1rem;">Update</th><th style="padding: 1rem;">Date</th></tr>
                            ${this.state.clients.flatMap(c => (c.history || []).map(h => `
                                <tr style="border-bottom: 1px solid #f1f5f9;">
                                    <td style="padding: 1rem;"><b>${c.name}</b></td>
                                    <td style="padding: 1rem;">${h.note}</td>
                                    <td style="padding: 1rem; color: var(--text-muted); font-size: 0.8rem;">${new Date(h.date).toLocaleDateString()}</td>
                                </tr>
                            `)).join('')}
                        </table>
                    </div>
                `;
            },

            renderClientPortal(el) {
                const c = this.state.user;
                el.innerHTML = `
                    <div style="background: var(--accent-red); padding: 5rem 3rem; color: white; margin: -3rem -3rem 3rem -3rem;">
                        <h1>Welcome, ${c.name}</h1>
                        <p>Quest Spark | Official Coaching Portal</p>
                    </div>
                    <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 2rem;">
                        <div>
                            <div class="card">
                                <h3>Your Journey Timeline</h3>
                                <div class="timeline" style="margin-top: 1.5rem;">${(c.history || []).map(h => `
                                    <div class="timeline-item">
                                        <div style="font-size: 0.75rem; color: var(--accent-blue); font-weight: 700;">${new Date(h.date).toLocaleDateString()}</div>
                                        <p style="margin-top: 0.5rem;">${h.note}</p>
                                    </div>
                                `).join('')}</div>
                            </div>
                        </div>
                        <div>
                            <div class="card">
                                <h3>Homework Checklist</h3>
                                <div style="margin-top: 1rem;">${(c.tasks || []).map(t => `
                                    <div class="task-row ${t.status === 'done' ? 'done' : ''}">
                                        <i data-lucide="${t.status === 'done' ? 'check-circle' : 'circle'}"></i>
                                        <span>${t.title}</span>
                                    </div>
                                `).join('')}</div>
                            </div>
                            <a href="https://wa.me/254711980306" class="btn btn-wa" style="width:100%;">Message Coach</a>
                        </div>
                    </div>
                `;
            },

            cardTpl(c) {
                return `
                    <div class="card client-card" onclick="app.showDetails(${c.id})">
                        <div style="display: flex; justify-content: space-between; margin-bottom: 1rem;">
                            <span class="badge ${c.status === 'Lead' ? 'badge-feedback' : 'badge-session'}">${c.status}</span>
                            <i data-lucide="external-link" style="width: 16px; color: var(--text-muted);"></i>
                        </div>
                        <h3>${c.name}</h3>
                        <p style="color: var(--text-muted); font-size: 0.8rem;">${c.industry}</p>
                    </div>
                `;
            }
        };

        app.init();
    </script>
</body>
</html>
