<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quest Spark | Professional Coaching CRM</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;600;700&display=swap');
        
        :root {
            --bg-main: #f0f9ff;
            --glass: rgba(255, 255, 255, 0.8);
            --accent-red: #8b1e1e;
            --accent-blue: #0284c7;
            --accent-emerald: #059669;
            --text-dark: #0f172a;
            --text-muted: #475569;
            --border: rgba(0, 0, 0, 0.1);
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.05);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--bg-main); color: var(--text-dark); min-height: 100vh; line-height: 1.6; }
        h1, h2, h3 { font-family: 'Outfit', sans-serif; font-weight: 700; }

        /* Layout */
        #app { display: flex; min-height: 100vh; }
        aside { width: 280px; background: white; border-right: 1px solid var(--border); padding: 2rem; position: fixed; height: 100vh; z-index: 100; }
        main { flex: 1; margin-left: 280px; padding: 3rem; max-width: 1400px; }

        /* Navigation */
        .logo { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 3rem; color: var(--accent-red); font-size: 1.25rem; }
        .nav-link { display: flex; align-items: center; gap: 1rem; padding: 0.75rem 1rem; color: var(--text-muted); text-decoration: none; border-radius: 12px; margin-bottom: 0.5rem; transition: all 0.2s; font-weight: 500; }
        .nav-link:hover { background: #f8fafc; color: var(--text-dark); }
        .nav-link.active { background: #eff6ff; color: var(--accent-blue); }

        /* Cards & UI */
        .card { background: var(--glass); backdrop-filter: blur(12px); border: 1px solid var(--border); border-radius: 20px; padding: 1.5rem; box-shadow: var(--shadow); }
        .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.5rem; margin-bottom: 2.5rem; }
        .client-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1.5rem; }
        
        .client-card { position: relative; border-left: 5px solid transparent; transition: transform 0.2s; }
        .client-card:hover { transform: translateY(-4px); }
        .client-card.lead { border-color: var(--accent-blue); }
        .client-card.onboarded { border-color: var(--accent-emerald); }

        .btn { padding: 0.75rem 1.5rem; border-radius: 12px; border: none; font-weight: 600; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; gap: 0.5rem; }
        .btn-primary { background: var(--accent-red); color: white; }
        .btn-secondary { background: #f1f5f9; color: var(--text-dark); }
        .btn-wa { background: #25d366; color: white; text-decoration: none; justify-content: center; }

        /* Modals */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 1000; }
        .modal.active { display: flex; }
        .modal-content { background: white; padding: 2.5rem; border-radius: 24px; width: 100%; max-width: 500px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); }
        
        .form-group { margin-bottom: 1.25rem; }
        .form-group label { display: block; font-size: 0.875rem; font-weight: 600; margin-bottom: 0.5rem; }
        input, select, textarea { width: 100%; padding: 0.75rem; border: 1px solid var(--border); border-radius: 10px; font-family: inherit; }

        /* Timeline */
        .timeline { border-left: 2px solid var(--border); padding-left: 1.5rem; margin-left: 0.5rem; }
        .timeline-item { margin-bottom: 2rem; position: relative; }
        .timeline-item::before { content: ''; width: 12px; height: 12px; background: var(--accent-red); border-radius: 50%; position: absolute; left: -1.95rem; top: 0.4rem; }
        .timeline-date { font-size: 0.75rem; color: var(--accent-blue); font-weight: 700; margin-bottom: 0.25rem; }

        /* Print/PDF */
        @media print {
            aside, .btn, .modal { display: none !important; }
            main { margin-left: 0 !important; padding: 0 !important; }
            .card { border: 1px solid #ddd !important; break-inside: avoid; }
        }
    </style>
</head>
<body>

    <!-- Auth Screen -->
    <div id="auth-screen" class="modal active">
        <div class="modal-content" style="text-align: center;">
            <h1 style="color: var(--accent-red); margin-bottom: 1rem;">Quest Spark</h1>
            <p style="margin-bottom: 2.5rem; color: var(--text-muted);">Select your portal to continue</p>
            <div style="display: flex; flex-direction: column; gap: 1rem;">
                <button class="btn btn-primary" onclick="app.showCoachLogin()" style="justify-content: center; font-size: 1.1rem; padding: 1rem;">I am a Coach</button>
                <button class="btn btn-secondary" onclick="app.showClientLogin()" style="justify-content: center; font-size: 1.1rem; padding: 1rem;">I am a Client</button>
            </div>
        </div>
    </div>

    <!-- Coach Login Modal -->
    <div id="modal-coach-auth" class="modal">
        <div class="modal-content">
            <h2 style="margin-bottom: 1.5rem;">Coach Dashboard Access</h2>
            <form id="coach-login-form">
                <div class="form-group">
                    <label>Master Password</label>
                    <input type="password" id="coach-pass-input" required placeholder="Enter password...">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Unlock Dashboard</button>
                <button type="button" class="btn btn-secondary" style="width: 100%; margin-top: 1rem;" onclick="app.hideModals()">Back</button>
            </form>
        </div>
    </div>

    <!-- Set Password Modal (First Time Only) -->
    <div id="modal-set-password" class="modal">
        <div class="modal-content">
            <h2>Welcome, Coach!</h2>
            <p style="margin-bottom: 1.5rem; color: var(--text-muted);">Please set a secure master password for your dashboard.</p>
            <form id="set-password-form">
                <div class="form-group"><label>New Password</label><input type="password" id="new-master-pass" required></div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Save & Continue</button>
            </form>
        </div>
    </div>

    <!-- Client Login Modal -->
    <div id="modal-client-auth" class="modal">
        <div class="modal-content">
            <h2 style="margin-bottom: 1.5rem;">Client Journey Portal</h2>
            <form id="client-login-form">
                <div class="form-group"><label>Phone Number</label><input type="text" id="client-phone-input" placeholder="07XXXXXXXX" required></div>
                <div class="form-group"><label>Access Password</label><input type="password" id="client-pass-input" placeholder="Enter password..." required></div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">View My Journey</button>
                <button type="button" class="btn btn-secondary" style="width: 100%; margin-top: 1rem;" onclick="app.hideModals()">Back</button>
            </form>
        </div>
    </div>

    <!-- Main Application -->
    <div id="app" style="display: none;">
        <aside>
            <div class="logo">
                <i data-lucide="sparkles"></i>
                <span style="font-weight: 700;">Quest Spark</span>
            </div>
            <nav id="coach-nav">
                <a href="#" class="nav-link active" onclick="app.setView('dashboard')"><i data-lucide="layout-dashboard"></i> Dashboard</a>
                <a href="#" class="nav-link" onclick="app.setView('clients')"><i data-lucide="users"></i> Clients</a>
                <a href="#" class="nav-link" onclick="app.setView('tasks')"><i data-lucide="check-square"></i> Tasks</a>
                <a href="#" class="nav-link" onclick="app.setView('reports')"><i data-lucide="bar-chart-3"></i> Reports</a>
                <div style="margin-top: 2rem; padding-top: 2rem; border-top: 1px solid #eee;">
                    <button class="btn btn-primary" style="width: 100%;" onclick="app.showAddClient()">+ New Client</button>
                </div>
            </nav>
            <button class="btn btn-secondary" style="width: 100%; margin-top: auto;" onclick="location.reload()">Logout</button>
        </aside>
        
        <main>
            <div id="view-content"></div>
        </main>
    </div>

    <!-- Add/Edit Client Modal -->
    <div id="modal-client-form" class="modal">
        <div class="modal-content">
            <h2 id="client-form-title">New Contact</h2>
            <form id="client-form">
                <input type="hidden" id="f-id">
                <div class="form-group"><label>Full Name</label><input type="text" id="f-name" required></div>
                <div class="form-group"><label>Industry / Sector</label><input type="text" id="f-industry" required></div>
                <div style="display: flex; gap: 1rem;">
                    <div class="form-group" style="flex: 1;"><label>Status</label><select id="f-status"><option value="Lead">Lead</option><option value="Onboarded">Onboarded</option></select></div>
                    <div class="form-group" style="flex: 1;"><label>Phone</label><input type="text" id="f-phone" required></div>
                </div>
                <div class="form-group"><label>Portal Password</label><input type="text" id="f-password" value="1234" required></div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Save Client</button>
                <button type="button" class="btn btn-secondary" style="width: 100%; margin-top: 1rem;" onclick="app.hideModals()">Cancel</button>
            </form>
        </div>
    </div>

    <!-- Log Session Modal -->
    <div id="modal-log-session" class="modal">
        <div class="modal-content">
            <h2>Log Session</h2>
            <form id="session-form">
                <input type="hidden" id="s-client-id">
                <div class="form-group"><label>Note / Update</label><textarea id="s-note" rows="4" required placeholder="What happened in this session?"></textarea></div>
                <div class="form-group"><label>Type</label><select id="s-type"><option value="Session">Session</option><option value="Feedback">Feedback</option><option value="Onboarding">Onboarding</option></select></div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Post to Timeline</button>
                <button type="button" class="btn btn-secondary" style="width: 100%; margin-top: 1rem;" onclick="app.hideModals()">Cancel</button>
            </form>
        </div>
    </div>

    <script>
        const SB_URL = "https://ivmomvigwanfhwkreqic.supabase.co";
        const SB_KEY = "sb_publishable_5nDWK1EEGa5xWzrKLEqNfw_BNgjFUBp";
        const sb = supabase.createClient(SB_URL, SB_KEY);

        const app = {
            state: { role: null, view: 'dashboard', clients: [], user: null },
            
            async init() {
                lucide.createIcons();
            },

            async showCoachLogin() {
                const { data } = await sb.from('config').select('value').eq('key', 'master_password');
                if (!data || data.length === 0) document.getElementById('modal-set-password').classList.add('active');
                else document.getElementById('modal-coach-auth').classList.add('active');
            },

            showClientLogin() {
                document.getElementById('modal-client-auth').classList.add('active');
            },

            hideModals() {
                document.querySelectorAll('.modal').forEach(m => m.classList.remove('active'));
            },

            async coachLogin(pass) {
                const { data } = await sb.from('config').select('value').eq('key', 'master_password');
                if (data && data.some(row => String(row.value).trim() === String(pass).trim())) {
                    this.state.role = 'coach';
                    await this.loadData();
                    this.showApp();
                } else {
                    alert("Invalid Password. Please try again.");
                }
            },

            async clientLogin(phone, pass) {
                const { data } = await sb.from('clients').select('*').ilike('phone', `%${phone.slice(-9)}`).maybeSingle();
                if (data && String(data.password) === String(pass)) {
                    this.state.role = 'client';
                    this.state.user = data;
                    this.showApp();
                } else alert("Client not found or invalid password.");
            },

            async loadData() {
                const { data } = await sb.from('clients').select('*').order('name');
                this.state.clients = data || [];
                this.render();
            },

            showApp() {
                this.hideModals();
                document.getElementById('auth-screen').classList.remove('active');
                document.getElementById('app').style.display = 'flex';
                if (this.state.role === 'client') {
                    document.querySelector('aside').style.display = 'none';
                    document.querySelector('main').style.marginLeft = '0';
                }
                this.render();
            },

            setView(view) {
                this.state.view = view;
                document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
                const activeLink = Array.from(document.querySelectorAll('.nav-link')).find(l => l.textContent.toLowerCase().includes(view));
                if (activeLink) activeLink.classList.add('active');
                this.render();
            },

            showAddClient() {
                document.getElementById('client-form').reset();
                document.getElementById('f-id').value = '';
                document.getElementById('client-form-title').innerText = "New Contact";
                document.getElementById('modal-client-form').classList.add('active');
            },

            showEditClient(id) {
                const c = this.state.clients.find(x => x.id === id);
                document.getElementById('f-id').value = c.id;
                document.getElementById('f-name').value = c.name;
                document.getElementById('f-industry').value = c.industry;
                document.getElementById('f-phone').value = c.phone;
                document.getElementById('f-status').value = c.status;
                document.getElementById('f-password').value = c.password;
                document.getElementById('client-form-title').innerText = "Edit Contact";
                document.getElementById('modal-client-form').classList.add('active');
            },

            showLogSession(id) {
                document.getElementById('s-client-id').value = id;
                document.getElementById('s-note').value = '';
                document.getElementById('modal-log-session').classList.add('active');
            },

            async deleteClient(id) {
                if (confirm("Are you sure you want to delete this contact?")) {
                    await sb.from('clients').delete().eq('id', id);
                    this.loadData();
                }
            },

            render() {
                const content = document.getElementById('view-content');
                if (this.state.role === 'client') {
                    this.renderClientPortal(content);
                } else {
                    if (this.state.view === 'dashboard') this.renderDashboard(content);
                    if (this.state.view === 'clients') this.renderClients(content);
                    if (this.state.view === 'tasks') this.renderTasks(content);
                    if (this.state.view === 'reports') this.renderReports(content);
                }
                lucide.createIcons();
            },

            renderDashboard(el) {
                const leads = this.state.clients.filter(c => c.status === 'Lead').length;
                const onboarded = this.state.clients.filter(c => c.status === 'Onboarded').length;
                el.innerHTML = `
                    <h1 style="margin-bottom: 2rem;">Overview</h1>
                    <div class="stat-grid">
                        <div class="card"><p style="color: var(--text-muted); font-size: 0.8rem;">TOTAL CLIENTS</p><h2>${this.state.clients.length}</h2></div>
                        <div class="card"><p style="color: var(--accent-blue); font-size: 0.8rem;">ACTIVE LEADS</p><h2>${leads}</h2></div>
                        <div class="card"><p style="color: var(--accent-emerald); font-size: 0.8rem;">ONBOARDED</p><h2>${onboarded}</h2></div>
                    </div>
                    <h2 style="margin-bottom: 1.5rem;">Recent Contacts</h2>
                    <div class="client-grid">${this.state.clients.slice(0, 6).map(c => this.clientCardTemplate(c)).join('')}</div>
                `;
            },

            renderClients(el) {
                el.innerHTML = `
                    <h1 style="margin-bottom: 2rem;">All Clients</h1>
                    <div class="client-grid">${this.state.clients.map(c => this.clientCardTemplate(c)).join('')}</div>
                `;
            },

            renderTasks(el) {
                const tasks = this.state.clients.reduce((acc, c) => {
                    if (c.tasks) c.tasks.forEach(t => acc.push({ ...t, client: c.name }));
                    return acc;
                }, []);
                el.innerHTML = `
                    <h1 style="margin-bottom: 2rem;">Tasks & Reminders</h1>
                    <div class="card">
                        ${tasks.length === 0 ? '<p style="text-align:center; padding: 2rem;">No pending tasks. Great job!</p>' : `
                            <table style="width: 100%; border-collapse: collapse;">
                                <tr style="text-align: left; border-bottom: 1px solid #eee;"><th style="padding: 1rem;">Task</th><th style="padding: 1rem;">Client</th><th style="padding: 1rem;">Due</th></tr>
                                ${tasks.map(t => `<tr style="border-bottom: 1px solid #f8fafc;"><td style="padding: 1rem;">${t.title}</td><td style="padding: 1rem;">${t.client}</td><td style="padding: 1rem;">${new Date(t.due).toLocaleDateString()}</td></tr>`).join('')}
                            </table>
                        `}
                    </div>
                `;
            },

            renderReports(el) {
                el.innerHTML = `
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
                        <h1>Activity Reports</h1>
                        <div style="display: flex; gap: 1rem;">
                            <button class="btn btn-secondary" onclick="window.print()"><i data-lucide="printer"></i> Print PDF</button>
                            <button class="btn btn-primary" onclick="app.exportCSV()"><i data-lucide="download"></i> Export CSV</button>
                        </div>
                    </div>
                    <div class="card">
                        <table style="width: 100%; border-collapse: collapse;">
                            <tr style="text-align: left; border-bottom: 2px solid #eee;"><th style="padding: 1rem;">Date</th><th style="padding: 1rem;">Client</th><th style="padding: 1rem;">Type</th><th style="padding: 1rem;">Note</th></tr>
                            ${this.state.clients.flatMap(c => (c.history || []).map(h => `
                                <tr style="border-bottom: 1px solid #f1f5f9;">
                                    <td style="padding: 1rem; white-space: nowrap;">${new Date(h.date).toLocaleDateString()}</td>
                                    <td style="padding: 1rem; font-weight: 600;">${c.name}</td>
                                    <td style="padding: 1rem;">${h.type}</td>
                                    <td style="padding: 1rem;">${h.note}</td>
                                </tr>
                            `)).join('')}
                        </table>
                    </div>
                `;
            },

            renderClientPortal(el) {
                const c = this.state.user;
                el.innerHTML = `
                    <div style="background: linear-gradient(135deg, var(--accent-red), #6d1717); margin: -3rem -3rem 3rem -3rem; padding: 5rem 3rem; color: white;">
                        <h1 style="font-size: 3rem; margin-bottom: 0.5rem;">Hello, ${c.name}</h1>
                        <p style="font-size: 1.25rem; opacity: 0.9;">Welcome to your Coaching Journey</p>
                    </div>
                    <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 2rem;">
                        <div class="card">
                            <h2 style="margin-bottom: 2rem; display: flex; align-items: center; gap: 1rem;"><i data-lucide="scroll-text"></i> Progress Timeline</h2>
                            <div class="timeline">${(c.history || []).map(h => `
                                <div class="timeline-item">
                                    <div class="timeline-date">${new Date(h.date).toLocaleDateString()} • ${h.type}</div>
                                    <div style="background: #f8fafc; padding: 1.5rem; border-radius: 12px; border: 1px solid #eee;">${h.note}</div>
                                </div>
                            `).join('')}</div>
                        </div>
                        <div style="position: sticky; top: 2rem;">
                            <div class="card" style="margin-bottom: 1.5rem;">
                                <h3>Quick Actions</h3>
                                <a href="https://wa.me/254711980306" target="_blank" class="btn btn-wa" style="width:100%; margin-top: 1rem;"><i data-lucide="message-circle"></i> Message Coach</a>
                            </div>
                            <div class="card">
                                <h3>Portal Info</h3>
                                <p style="font-size: 0.8rem; color: var(--text-muted); margin-top: 1rem;">Status: <b>${c.status}</b></p>
                                <p style="font-size: 0.8rem; color: var(--text-muted);">Sector: <b>${c.industry}</b></p>
                            </div>
                        </div>
                    </div>
                `;
            },

            clientCardTemplate(c) {
                return `
                    <div class="card client-card ${c.status.toLowerCase()}">
                        <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1rem;">
                            <span style="font-size: 0.7rem; font-weight: 700; color: ${c.status === 'Lead' ? 'var(--accent-blue)' : 'var(--accent-emerald)'}; text-transform: uppercase;">${c.status}</span>
                            <div style="display: flex; gap: 0.5rem;">
                                <button onclick="app.showEditClient(${c.id})" style="background:none; border:none; cursor:pointer; color:var(--text-muted);"><i data-lucide="edit-2" style="width: 16px;"></i></button>
                                <button onclick="app.deleteClient(${c.id})" style="background:none; border:none; cursor:pointer; color:var(--accent-red);"><i data-lucide="trash-2" style="width: 16px;"></i></button>
                            </div>
                        </div>
                        <h3 style="margin-bottom: 0.25rem;">${c.name}</h3>
                        <p style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 1.5rem;">${c.industry}</p>
                        <div style="display: flex; flex-direction: column; gap: 0.5rem;">
                            <button class="btn btn-primary" onclick="app.showLogSession(${c.id})" style="width: 100%; justify-content: center;">Log Session</button>
                            <a href="https://wa.me/254${c.phone.slice(-9)}" target="_blank" class="btn btn-wa"><i data-lucide="message-circle"></i> WhatsApp</a>
                        </div>
                    </div>
                `;
            },

            exportCSV() {
                const rows = [["Date", "Client", "Type", "Note"]];
                this.state.clients.forEach(c => (c.history || []).forEach(h => rows.push([new Date(h.date).toLocaleDateString(), c.name, h.type, h.note.replace(/,/g, ';')])));
                const csv = "data:text/csv;charset=utf-8," + rows.map(e => e.join(",")).join("\n");
                const link = document.createElement("a"); link.href = encodeURI(csv); link.download = "QuestSpark_Report.csv"; link.click();
            }
        };

        // Form Event Listeners
        document.getElementById('coach-login-form').onsubmit = e => { e.preventDefault(); app.coachLogin(document.getElementById('coach-pass-input').value); };
        document.getElementById('set-password-form').onsubmit = async e => {
            e.preventDefault();
            const pass = document.getElementById('new-master-pass').value;
            await sb.from('config').delete().eq('key', 'master_password');
            await sb.from('config').insert({ key: 'master_password', value: pass });
            app.coachLogin(pass);
        };
        document.getElementById('client-login-form').onsubmit = e => {
            e.preventDefault();
            app.clientLogin(document.getElementById('client-phone-input').value, document.getElementById('client-pass-input').value);
        };
        document.getElementById('client-form').onsubmit = async e => {
            e.preventDefault();
            const id = document.getElementById('f-id').value;
            const client = {
                name: document.getElementById('f-name').value,
                industry: document.getElementById('f-industry').value,
                status: document.getElementById('f-status').value,
                phone: document.getElementById('f-phone').value,
                password: document.getElementById('f-password').value,
                history: id ? app.state.clients.find(x => x.id == id).history : [],
                tasks: id ? app.state.clients.find(x => x.id == id).tasks : []
            };
            if (id) await sb.from('clients').update(client).eq('id', id);
            else await sb.from('clients').insert(client);
            app.hideModals();
            app.loadData();
        };
        document.getElementById('session-form').onsubmit = async e => {
            e.preventDefault();
            const id = document.getElementById('s-client-id').value;
            const client = app.state.clients.find(x => x.id == id);
            const history = client.history || [];
            history.unshift({ date: new Date().toISOString(), note: document.getElementById('s-note').value, type: document.getElementById('s-type').value });
            await sb.from('clients').update({ history }).eq('id', id);
            app.hideModals();
            app.loadData();
        };

        app.init();
    </script>
</body>
</html>
