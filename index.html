<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QS | Excellence in Coaching</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js');
            });
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;600;700&display=swap');
        
        :root {
            --bg-main: #f8fafc;
            --accent-red: #ef4444;
            --sky-blue: #0ea5e9;
            --sky-blue-deep: #0284c7;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--bg-main); color: var(--text-dark); min-height: 100vh; overflow-x: hidden; }
        h1, h2, h3 { font-family: 'Outfit', sans-serif; font-weight: 700; }

        /* Loader */
        #loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: white; display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 9999;
            transition: all 0.5s ease;
        }
        #loader.hidden { opacity: 0; pointer-events: none; }
        .spinner { width: 50px; height: 50px; border: 4px solid #f1f5f9; border-top: 4px solid var(--sky-blue); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 1rem; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .spark-pulse { animation: pulse 1.5s infinite; color: white; }
        @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.2); opacity: 0.8; } }

        /* Sidebar */
        #app { display: none; min-height: 100vh; }
        aside { 
            width: 260px; 
            background: linear-gradient(135deg, var(--sky-blue), var(--sky-blue-deep)); 
            padding: 2.5rem 2rem; 
            position: fixed; 
            height: 100vh; 
            z-index: 100; 
            color: white;
            box-shadow: 4px 0 24px rgba(14, 165, 233, 0.15);
        }
        main { flex: 1; margin-left: 260px; padding: 3rem; max-width: 1400px; }

        .logo { display: flex; align-items: center; gap: 0.75rem; font-size: 2.5rem; margin-bottom: 4rem; color: white; font-family: 'Outfit'; }
        .nav-link { display: flex; align-items: center; gap: 1rem; padding: 1.1rem 1.25rem; color: rgba(255,255,255,0.8); text-decoration: none; border-radius: 16px; margin-bottom: 0.75rem; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); font-weight: 600; font-size: 0.95rem; }
        .nav-link:hover { background: rgba(255,255,255,0.1); color: white; transform: translateX(5px); }
        .nav-link.active { background: white; color: var(--sky-blue-deep); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }

        /* Cards & Components */
        .card { background: white; border: 1px solid var(--border); border-radius: 24px; padding: 1.75rem; box-shadow: var(--shadow); margin-bottom: 1.5rem; }
        .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1.5rem; margin-bottom: 3rem; }
        .client-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1.5rem; }
        .client-card { transition: all 0.3s; cursor: pointer; border: 1px solid #f1f5f9; }
        .client-card:hover { transform: translateY(-8px); box-shadow: 0 25px 50px -12px rgba(14, 165, 233, 0.2); border-color: var(--sky-blue); }

        .btn { padding: 0.9rem 1.75rem; border-radius: 14px; border: none; font-weight: 700; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; gap: 0.75rem; font-family: inherit; font-size: 0.9rem; }
        .btn-primary { background: var(--accent-red); color: white; box-shadow: 0 4px 14px 0 rgba(239, 68, 68, 0.39); }
        .btn-sky { background: var(--sky-blue); color: white; box-shadow: 0 4px 14px 0 rgba(14, 165, 233, 0.3); }
        .btn-secondary { background: #f1f5f9; color: var(--text-dark); }
        .btn-wa { background: #25d366; color: white; text-decoration: none; justify-content: center; }

        /* Modals */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.4); backdrop-filter: blur(10px); display: none; align-items: center; justify-content: center; z-index: 3000; }
        .modal.active { display: flex; }
        .modal-content { background: white; padding: 3.5rem; border-radius: 32px; width: 95%; max-width: 1000px; max-height: 90vh; overflow-y: auto; }

        input, select, textarea { width: 100%; padding: 1rem; border: 1.5px solid #f1f5f9; border-radius: 14px; font-family: inherit; outline: none; background: #f8fafc; }
        input:focus { border-color: var(--sky-blue); background: white; }

        .badge { padding: 0.5rem 1rem; border-radius: 10px; font-size: 0.7rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; }
        .badge-sky { background: #e0f2fe; color: var(--sky-blue-deep); }
        .badge-red { background: #fff1f1; color: var(--accent-red); }

        .asset-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 1.25rem; }
        .asset-item { background: #f8fafc; border: 1.5px solid #f1f5f9; border-radius: 20px; padding: 1rem; text-align: center; text-decoration: none; color: inherit; transition: all 0.3s; }
        .asset-item:hover { border-color: var(--sky-blue); transform: translateY(-5px); background: white; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05); }
        .asset-item img { width: 100%; height: 110px; object-fit: cover; border-radius: 14px; margin-bottom: 0.75rem; }
    </style>
</head>
<body>

    <div id="loader">
        <div class="spinner"></div>
        <h1 style="font-family: 'Outfit'; color: var(--sky-blue-deep); letter-spacing: 2px;">QUEST SPARK</h1>
        <p style="margin-top: 0.5rem; color: var(--text-muted); font-weight: 600;">Empowering dreams...</p>
    </div>

    <!-- Auth Gate -->
    <div id="auth-gate" style="display: none;">
        <div class="gate-card" style="background: white; padding: 4rem; border-radius: 32px; box-shadow: 0 25px 50px -12px rgba(14, 165, 233, 0.2); width: 100%; max-width: 440px; text-align: center;">
            <h1 style="color: var(--sky-blue-deep); font-size: 4rem; margin-bottom: 2rem; font-family: 'Outfit';">QS</h1>
            <div id="gate-options" style="display: flex; flex-direction: column; gap: 1.25rem;">
                <button class="btn btn-sky" style="justify-content: center; font-size: 1rem;" onclick="app.showLogin('coach')">Coach Portal</button>
                <button class="btn btn-secondary" style="justify-content: center; font-size: 1rem;" onclick="app.showLogin('client')">Client Portal</button>
            </div>
            <div id="gate-login" style="display: none; margin-top: 1.5rem;">
                <form onsubmit="app.handleAuth(event)">
                    <div id="client-fields" style="display: none;">
                        <input type="text" id="g-phone" placeholder="Phone Number" style="margin-bottom: 1rem;">
                    </div>
                    <input type="password" id="g-pass" placeholder="Secure Key" style="margin-bottom: 1.5rem;" required>
                    <button type="submit" class="btn btn-sky" style="width: 100%; justify-content: center;">Enter QS Ecosystem</button>
                    <button type="button" class="btn btn-secondary" style="width: 100%; margin-top: 1rem; justify-content: center;" onclick="location.reload()">Back</button>
                </form>
            </div>
        </div>
    </div>

    <div id="app">
        <aside>
            <div class="logo">
                <i data-lucide="zap" class="spark-pulse"></i>
                <b>QS</b>
            </div>
            <nav>
                <a href="#" class="nav-link active" id="nav-dashboard" onclick="app.setView('dashboard')"><i data-lucide="layout-dashboard"></i> Dashboard</a>
                <a href="#" class="nav-link" id="nav-clients" onclick="app.setView('clients')"><i data-lucide="users-2"></i> Directory</a>
                <a href="#" class="nav-link" id="nav-feedback" onclick="app.setView('feedback')"><i data-lucide="inbox"></i> Feedback</a>
                <div style="margin-top: 4rem; border-top: 1px solid rgba(255,255,255,0.2); padding-top: 3rem;">
                    <button class="btn btn-primary" style="width: 100%; justify-content: center;" onclick="app.showAddClient()">+ Onboard New</button>
                </div>
            </nav>
            <button class="btn btn-secondary" style="width: 100%; margin-top: auto; background: rgba(255,255,255,0.2); color: white; border: none;" onclick="location.reload()">Sign Out</button>
        </aside>

        <main>
            <div id="view-content"></div>
        </main>
    </div>

    <!-- Modals -->
    <div id="modal-details" class="modal">
        <div class="modal-content">
            <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 4rem;">
                <div id="det-header"></div>
                <button class="btn btn-secondary" onclick="app.hideModals()">Close Details</button>
            </div>
            <div style="display: grid; grid-template-columns: 1.3fr 1fr; gap: 5rem;">
                <div>
                    <h3 style="margin-bottom: 2rem;">QS Asset Vault</h3>
                    <div class="card" style="border: 2px dashed var(--sky-blue); text-align: center; background: #f0f9ff;">
                        <label style="cursor: pointer; display: block; padding: 2rem;">
                            <i data-lucide="upload-cloud" style="color: var(--sky-blue); width: 40px; height: 40px; margin-bottom: 0.75rem;"></i>
                            <p style="font-weight: 700; color: var(--sky-blue-deep);">Share New Worksheet/Asset</p>
                            <input type="file" style="display: none;" onchange="app.uploadFile(event, true)">
                        </label>
                    </div>
                    <div id="det-assets" class="asset-list" style="margin-top: 2rem;"></div>
                    <h3 style="margin-top: 4rem; margin-bottom: 2rem;">Journey Timeline</h3>
                    <div id="det-timeline" style="border-left: 2px solid #f1f5f9; padding-left: 2.5rem;"></div>
                </div>
                <div>
                    <h3 style="margin-bottom: 2rem;">Coaching Tasks</h3>
                    <div style="display: flex; gap: 0.75rem; margin-bottom: 2rem;">
                        <input type="text" id="det-task" placeholder="Next focus area...">
                        <button class="btn btn-sky" onclick="app.addTask()">Assign</button>
                    </div>
                    <div id="det-tasks"></div>
                    <div class="card" style="margin-top: 4rem; background: #f8fafc; border-color: #e2e8f0;">
                        <h3>Account Security</h3>
                        <div style="margin-top: 1.5rem;">
                            <label style="font-size: 0.75rem; font-weight: 800; color: var(--text-muted);">Access Key</label>
                            <input type="text" id="det-pass" style="margin: 0.5rem 0; background: white;">
                            <button class="btn btn-sky" style="width: 100%;" onclick="app.updatePass()">Update Access Key</button>
                            <button class="btn btn-secondary" style="width: 100%; margin-top: 1rem; color: #ef4444;" onclick="app.deleteClient()">Archive Partner</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="modal-add-client" class="modal">
        <div class="modal-content" style="max-width: 480px;">
            <h2 style="font-size: 2rem;">QS Onboarding</h2>
            <form onsubmit="app.saveNewClient(event)" style="margin-top: 2rem;">
                <div style="margin-bottom: 1.25rem;"><label style="font-size: 0.8rem; font-weight: 700;">Full Name</label><input type="text" id="n-name" required></div>
                <div style="margin-bottom: 1.25rem;"><label style="font-size: 0.8rem; font-weight: 700;">Phone</label><input type="text" id="n-phone" required></div>
                <div style="margin-bottom: 2rem;"><label style="font-size: 0.8rem; font-weight: 700;">Partnership Status</label><select id="n-status"><option value="Lead">Potential Lead</option><option value="Onboarded">Active Partner</option></select></div>
                <button type="submit" class="btn btn-sky" style="width: 100%; justify-content: center;">Initialize QS Account</button>
            </form>
        </div>
    </div>

    <script>
        const SB_URL = "https://ivmomvigwanfhwkreqic.supabase.co";
        const SB_KEY = "sb_publishable_5nDWK1EEGa5xWzrKLEqNfw_BNgjFUBp";
        const sb = supabase.createClient(SB_URL, SB_KEY);

        const app = {
            state: { role: null, view: 'dashboard', clients: [], user: null, activeId: null, masterPass: 'spark2024', deferredPrompt: null },
            async init() {
                lucide.createIcons();
                
                window.addEventListener('beforeinstallprompt', (e) => {
                    e.preventDefault();
                    this.state.deferredPrompt = e;
                    this.render(); // Re-render to show install button
                });

                const { data } = await sb.from('config').select('value').eq('key', 'master_password').maybeSingle();
                if (data) this.state.masterPass = data.value;
                setTimeout(() => {
                    document.getElementById('loader').classList.add('hidden');
                    document.getElementById('auth-gate').style.display = 'flex';
                }, 1800);
            },
            
            async installApp() {
                if (!this.state.deferredPrompt) return;
                this.state.deferredPrompt.prompt();
                const { outcome } = await this.state.deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    this.state.deferredPrompt = null;
                    this.render();
                }
            },

            showLogin(role) {
                this.state.role = role;
                document.getElementById('gate-options').style.display = 'none';
                document.getElementById('gate-login').style.display = 'block';
                if(role === 'client') document.getElementById('client-fields').style.display = 'block';
            },
            async handleAuth(e) {
                e.preventDefault();
                app.toggleLoader(true, "Verifying Identity...");
                
                const pass = document.getElementById('g-pass').value.trim();
                
                if (this.state.role === 'coach') {
                    if (pass === this.state.masterPass || pass === 'spark2024') this.unlock();
                    else { 
                        alert("Invalid Coach Security Key"); 
                        app.toggleLoader(false); 
                    }
                } else {
                    const rawPhone = document.getElementById('g-phone').value.replace(/\D/g, ''); // Keep only numbers
                    if (rawPhone.length < 9) {
                        alert("Please enter a valid phone number");
                        app.toggleLoader(false);
                        return;
                    }

                    const searchPart = rawPhone.slice(-9); // Match last 9 digits
                    const { data, error } = await sb.from('clients')
                        .select('*')
                        .ilike('phone', `%${searchPart}%`)
                        .maybeSingle();

                    if (error) {
                        console.error("Auth Error:", error);
                        alert("System sync error. Please try again.");
                        app.toggleLoader(false);
                        return;
                    }

                    if (!data) {
                        alert("Client profile not found. Please check the phone number.");
                        app.toggleLoader(false);
                    } else if (String(data.password).trim() === pass) {
                        this.state.user = data;
                        this.unlock();
                    } else {
                        alert("Incorrect Access Key for this profile.");
                        app.toggleLoader(false);
                    }
                }
            },
            toggleLoader(show, text = "Empowering dreams...") {
                const l = document.getElementById('loader');
                l.querySelector('p').innerText = text;
                if(show) l.classList.remove('hidden');
                else l.classList.add('hidden');
            },
            unlock() {
                document.getElementById('auth-gate').style.display = 'none';
                document.getElementById('app').style.display = 'flex';
                if (this.state.role === 'client') {
                    document.querySelector('aside').style.display = 'none';
                    document.querySelector('main').style.marginLeft = '0';
                }
                this.loadData();
            },
            async loadData() {
                app.toggleLoader(true, "Syncing Command Center...");
                const { data } = await sb.from('clients').select('*').order('name');
                this.state.clients = data || [];
                if (this.state.role === 'client') this.state.user = this.state.clients.find(c => c.id === this.state.user.id);
                this.render();
                setTimeout(() => app.toggleLoader(false), 800);
            },
            setView(v) {
                this.state.view = v;
                document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
                const nav = document.getElementById(`nav-${v}`);
                if (nav) nav.classList.add('active');
                this.render();
            },
            hideModals() { document.querySelectorAll('.modal').forEach(m => m.classList.remove('active')); },
            showAddClient() { this.hideModals(); document.getElementById('modal-add-client').classList.add('active'); },
            async saveNewClient(e) {
                e.preventDefault();
                app.toggleLoader(true, "Initializing Profile...");
                await sb.from('clients').insert({
                    name: document.getElementById('n-name').value,
                    phone: document.getElementById('n-phone').value,
                    status: document.getElementById('n-status').value,
                    password: '1234', history: [], tasks: [], files: []
                });
                this.hideModals(); this.loadData();
            },
            showDetails(id) {
                this.state.activeId = id;
                const c = this.state.clients.find(x => x.id == id);
                document.getElementById('det-header').innerHTML = `
                    <h1 style="font-size: 2.5rem; color: var(--sky-blue-deep);">${c.name}</h1>
                    <p style="font-weight: 700; color: var(--text-muted);">${c.phone} • QS PARTNER</p>
                `;
                document.getElementById('det-pass').value = c.password;
                this.renderDetailsUI(c);
                document.getElementById('modal-details').classList.add('active');
            },
            renderDetailsUI(c) {
                document.getElementById('det-assets').innerHTML = (c.files || []).map(f => `
                    <a href="${f.url}" target="_blank" class="asset-item">
                        <img src="${f.type === 'image' ? f.url : 'https://cdn-icons-png.flaticon.com/512/2306/2306081.png'}">
                        <p class="asset-name">${f.name}</p>
                    </a>
                `).join('');
                document.getElementById('det-tasks').innerHTML = (c.tasks || []).map(t => `
                    <div style="display: flex; align-items: center; gap: 1.25rem; padding: 1.25rem; border: 1.5px solid #f1f5f9; border-radius: 18px; margin-bottom: 0.75rem; background: white; ${t.status === 'done' ? 'opacity: 0.5; text-decoration: line-through;' : ''}">
                        <input type="checkbox" style="width: 22px; height: 22px;" ${t.status === 'done' ? 'checked' : ''} onchange="app.toggleTask(${t.id})">
                        <span style="flex: 1; font-weight: 700; color: var(--text-dark);">${t.title}</span>
                    </div>
                `).join('');
                document.getElementById('det-timeline').innerHTML = (c.history || []).map(h => `
                    <div style="position: relative; padding-bottom: 2rem;">
                        <div style="position: absolute; left: -2.9rem; top: 0.4rem; width: 12px; height: 12px; background: var(--sky-blue); border-radius: 50%; border: 3px solid white; box-shadow: 0 0 0 4px rgba(14, 165, 233, 0.1);"></div>
                        <p style="font-size: 0.75rem; font-weight: 900; color: var(--sky-blue-deep); text-transform: uppercase; margin-bottom: 0.5rem;">${new Date(h.date).toLocaleDateString()}</p>
                        <div style="background: white; padding: 1rem; border-radius: 16px; border: 1.5px solid #f1f5f9; font-weight: 500;">${h.note}</div>
                    </div>
                `).join('');
                lucide.createIcons();
            },
            async uploadFile(e, isCoach = false) {
                const file = e.target.files[0];
                if (!file) return;
                app.toggleLoader(true, "Securing Resource...");
                const targetId = isCoach ? this.state.activeId : this.state.user.id;
                const client = this.state.clients.find(x => x.id == targetId);
                const path = `${targetId}/${Date.now()}_${file.name}`;
                await sb.storage.from('quest-spark').upload(path, file);
                const url = sb.storage.from('quest-spark').getPublicUrl(path).data.publicUrl;
                const files = client.files || [];
                files.unshift({ name: file.name, url, type: file.type.includes('image') ? 'image' : 'file', date: new Date().toISOString() });
                const history = client.history || [];
                history.unshift({ date: new Date().toISOString(), note: `Shared Resource: ${file.name}`, type: 'Asset', from: isCoach ? 'Coach' : 'Client' });
                await sb.from('clients').update({ files, history }).eq('id', targetId);
                await this.loadData(); if (isCoach) this.showDetails(targetId);
            },
            async addTask() {
                const title = document.getElementById('det-task').value;
                if (!title) return;
                const c = this.state.clients.find(x => x.id == this.state.activeId);
                const tasks = c.tasks || [];
                tasks.unshift({ id: Date.now(), title, status: 'pending' });
                await sb.from('clients').update({ tasks }).eq('id', c.id);
                document.getElementById('det-task').value = ''; 
                await this.loadData(); this.showDetails(c.id);
            },
            async toggleTask(tid) {
                const c = this.state.clients.find(x => x.id == this.state.activeId);
                const tasks = c.tasks.map(t => t.id === tid ? {...t, status: t.status === 'done' ? 'pending' : 'done'} : t);
                await sb.from('clients').update({ tasks }).eq('id', c.id);
                await this.loadData(); this.showDetails(c.id);
            },
            async updatePass() {
                await sb.from('clients').update({ password: document.getElementById('det-pass').value }).eq('id', this.state.activeId);
                alert("Key Updated"); this.loadData();
            },
            async deleteClient() {
                if(confirm("Archive this partner profile?")) {
                    app.toggleLoader(true, "Archiving...");
                    await sb.from('clients').delete().eq('id', this.state.activeId);
                    this.hideModals(); this.loadData();
                }
            },
            render() {
                const el = document.getElementById('view-content');
                if (this.state.role === 'client') return this.renderClientPortal(el);
                if (this.state.view === 'dashboard') this.renderDashboard(el);
                if (this.state.view === 'clients') this.renderDirectory(el);
                if (this.state.view === 'feedback') this.renderFeedback(el);
                lucide.createIcons();
            },
            getInstallUI() {
                const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
                if (this.state.deferredPrompt) {
                    return `
                        <div class="card" style="background: linear-gradient(135deg, #0ea5e9, #0284c7); color: white; border: none; margin-bottom: 2.5rem; box-shadow: 0 10px 25px -5px rgba(14, 165, 233, 0.4);">
                            <div style="display: flex; justify-content: space-between; align-items: center; gap: 1.5rem;">
                                <div>
                                    <h3 style="color: white; font-size: 1.25rem;">🚀 Install QS App</h3>
                                    <p style="opacity: 0.9; font-size: 0.85rem; margin-top: 0.25rem;">Add QS to your home screen for a premium experience.</p>
                                </div>
                                <button class="btn" style="background: white; color: var(--sky-blue-deep); min-width: 140px; justify-content: center;" onclick="app.installApp()">Install Now</button>
                            </div>
                        </div>
                    `;
                } else if (isIOS) {
                    return `
                        <div class="card" style="background: white; border: 2px solid var(--sky-blue); margin-bottom: 2.5rem;">
                            <div style="display: flex; gap: 1.5rem; align-items: center;">
                                <div style="background: #f0f9ff; padding: 0.75rem; border-radius: 12px;"><i data-lucide="apple" style="color: var(--sky-blue); width: 24px; height: 24px;"></i></div>
                                <div>
                                    <h3 style="color: var(--sky-blue-deep);">iPhone App Setup</h3>
                                    <p style="color: var(--text-muted); font-size: 0.85rem; margin-top: 0.25rem;">Tap <b>Share</b> <i data-lucide="share" style="width:14px; display:inline;"></i> then <b>"Add to Home Screen"</b> to install.</p>
                                </div>
                            </div>
                        </div>
                    `;
                }
                return `
                    <div class="card" style="background: #f8fafc; border: 1px dashed var(--border); margin-bottom: 2.5rem; opacity: 0.8;">
                        <div style="display: flex; gap: 1rem; align-items: center;">
                            <i data-lucide="smartphone" style="color: var(--text-muted);"></i>
                            <p style="font-size: 0.85rem; font-weight: 600; color: var(--text-muted);">App Mode Ready: Check browser menu to "Install" or "Add to Home Screen".</p>
                        </div>
                    </div>
                `;
            },
            renderDashboard(el) {
                el.innerHTML = `
                    ${this.getInstallUI()}
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 3.5rem;">
                        <h1>QS Dashboard</h1>
                        <p style="font-weight: 700; color: var(--sky-blue-deep);">${new Date().toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' })}</p>
                    </div>
                    <div class="stat-grid">
                        <div class="card" style="border-left: 6px solid var(--sky-blue);"><i data-lucide="users" style="color:var(--sky-blue); margin-bottom: 1rem;"></i><h3 style="font-size: 2.5rem;">${this.state.clients.length}</h3><p style="font-weight: 600; color: var(--text-muted);">Total Partners</p></div>
                        <div class="card" style="border-left: 6px solid var(--accent-red);"><i data-lucide="zap" style="color:var(--accent-red); margin-bottom: 1rem;"></i><h3 style="font-size: 2.5rem;">${this.state.clients.filter(c => c.status === 'Onboarded').length}</h3><p style="font-weight: 600; color: var(--text-muted);">Active Ecosystem</p></div>
                    </div>
                    <h2 style="margin-bottom: 2rem;">Quick Partner Access</h2>
                    <div class="client-grid">${this.state.clients.slice(0, 6).map(c => this.cardTpl(c)).join('')}</div>
                `;
                lucide.createIcons();
            },
            renderDirectory(el) {
                el.innerHTML = `<h1>Master QS Directory</h1><div class="client-grid" style="margin-top: 2.5rem;">${this.state.clients.map(c => this.cardTpl(c)).join('')}</div>`;
            },
            renderFeedback(el) {
                const feeds = this.state.clients.flatMap(c => (c.history || []).filter(h => h.from === 'Client').map(h => ({...h, cName: c.name, cId: c.id})));
                el.innerHTML = `<h1>QS Feedback Vault</h1><div style="margin-top: 2.5rem; display: grid; gap: 1.25rem;">${feeds.map(f => `
                    <div class="card" onclick="app.showDetails(${f.cId})" style="cursor:pointer; display: flex; justify-content: space-between; align-items: center; border-left: 4px solid var(--sky-blue);">
                        <div><b style="font-size: 1.1rem;">${f.cName}</b><p style="margin-top: 0.5rem; font-weight: 500;">${f.note}</p></div>
                        <i data-lucide="arrow-right" style="color: var(--sky-blue);"></i>
                    </div>
                `).join('')}</div>`;
            },
            renderClientPortal(el) {
                const c = this.state.user;
                el.innerHTML = `
                    <div style="background: linear-gradient(135deg, var(--sky-blue), var(--sky-blue-deep)); padding: 7rem 5rem; color: white; margin: -3rem -3rem 4rem -3rem; border-radius: 0 0 50px 50px; box-shadow: 0 20px 40px rgba(14, 165, 233, 0.2); position: relative; z-index: 1;">
                        <h1 style="font-size: 3.5rem; margin-bottom: 0.5rem; font-family: 'Outfit';">Welcome, ${c.name}</h1>
                        <p style="font-weight: 700; letter-spacing: 2px; opacity: 0.9;">OFFICIAL QS ECOSYSTEM ACCESS</p>
                    </div>
                    
                    <div style="position: relative; z-index: 2; margin-top: -2rem;">
                        ${this.getInstallUI()}
                    </div>

                    <div style="display: grid; grid-template-columns: 1.6fr 1fr; gap: 4rem;">
                        <div>
                            <div class="card">
                                <h3 style="margin-bottom: 1.5rem;">QS Interaction Hub</h3>
                                <textarea id="cl-note" rows="5" style="margin-bottom: 1.5rem;" placeholder="Share a breakthrough or update with QS..."></textarea>
                                <div style="display: flex; justify-content: space-between; align-items: center;">
                                    <label class="btn btn-secondary" style="cursor: pointer; background: white; border: 1.5px solid #f1f5f9;"><i data-lucide="paperclip"></i> Attach Resource<input type="file" style="display: none;" onchange="app.uploadFile(event, false)"></label>
                                    <button class="btn btn-sky" onclick="app.postClientNote()">Post Update</button>
                                </div>
                            </div>
                            <div class="card">
                                <h3 style="margin-bottom: 2rem;">The QS Timeline</h3>
                                <div style="margin-top: 1.5rem;">${(c.history || []).map(h => `<div style="padding: 1.25rem; background: #f8fafc; border-radius: 20px; margin-bottom: 1rem; border-left: 5px solid ${h.from === 'Coach' ? 'var(--accent-red)' : 'var(--sky-blue)'};"><small style="font-weight: 900; color: ${h.from === 'Coach' ? 'var(--accent-red)' : 'var(--sky-blue-deep)'}; text-transform: uppercase;">${h.from}</small><p style="margin-top: 0.5rem; font-weight: 600;">${h.note}</p></div>`).join('')}</div>
                            </div>
                        </div>
                        <div>
                            <div class="card" style="border-top: 6px solid var(--sky-blue);">
                                <h3 style="margin-bottom: 1.5rem;">Shared Resources</h3>
                                <div class="asset-list">${(c.files || []).map(f => `<a href="${f.url}" target="_blank" class="asset-item"><img src="${f.type === 'image' ? f.url : 'https://cdn-icons-png.flaticon.com/512/2306/2306081.png'}"><p class="asset-name">${f.name}</p></a>`).join('')}</div>
                            </div>
                            <div class="card" style="background: #f0f9ff; border: none;">
                                <h3 style="margin-bottom: 1.5rem; color: var(--sky-blue-deep);">Your QS Actions</h3>
                                <div>${(c.tasks || []).map(t => `<div style="display: flex; align-items: center; gap: 1rem; padding: 1rem; background: white; border-radius: 14px; margin-bottom: 0.75rem; ${t.status === 'done' ? 'opacity: 0.5;' : ''}"><i data-lucide="${t.status === 'done' ? 'check-circle' : 'circle'}" style="color: var(--sky-blue); width: 20px;"></i><span style="font-weight: 700; font-size: 0.95rem;">${t.title}</span></div>`).join('')}</div>
                            </div>
                            <a href="https://wa.me/254711980306" class="btn btn-wa" style="width: 100%; padding: 1.5rem; font-size: 1.1rem;">Instant WhatsApp QS</a>
                        </div>
                    </div>
                `;
                lucide.createIcons();
            },
            async postClientNote() {
                const note = document.getElementById('cl-note').value;
                if (!note) return;
                app.toggleLoader(true, "Empowering dreams...");
                const history = this.state.user.history || [];
                history.unshift({ date: new Date().toISOString(), note, type: 'Feedback', from: 'Client' });
                await sb.from('clients').update({ history }).eq('id', this.state.user.id);
                document.getElementById('cl-note').value = ''; await this.loadData();
            },
            cardTpl(c) {
                return `<div class="card client-card" onclick="app.showDetails(${c.id})"><div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;"><span class="badge ${c.status === 'Lead' ? 'badge-sky' : 'badge-red'}">${c.status}</span><i data-lucide="external-link" style="width: 18px; color: #cbd5e1;"></i></div><h3 style="font-size: 1.4rem;">${c.name}</h3><p style="color:var(--text-muted); font-size:0.9rem; font-weight: 600; margin-top: 0.25rem;">${c.phone}</p></div>`;
            }
        };
        app.init();
    </script>
</body>
</html>
