<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quest Spark | Coaching Excellence CRM</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;600;700&display=swap');
        
        :root {
            --bg-main: #f8fafc;
            --glass: rgba(255, 255, 255, 0.9);
            --accent-red: #8b1e1e;
            --accent-blue: #0284c7;
            --accent-emerald: #059669;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--bg-main); color: var(--text-dark); min-height: 100vh; line-height: 1.6; }
        h1, h2, h3 { font-family: 'Outfit', sans-serif; font-weight: 700; }

        /* Auth Gate */
        #auth-gate { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; display: flex; align-items: center; justify-content: center; z-index: 2000; }
        .gate-card { padding: 3rem; text-align: center; max-width: 400px; width: 100%; }

        /* Layout */
        #app { display: none; min-height: 100vh; }
        aside { width: 280px; background: white; border-right: 1px solid var(--border); padding: 2rem; position: fixed; height: 100vh; z-index: 100; }
        main { flex: 1; margin-left: 280px; padding: 3rem; max-width: 1400px; }

        /* Navigation */
        .logo { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 3rem; color: var(--accent-red); font-size: 1.25rem; cursor: pointer; }
        .nav-link { display: flex; align-items: center; gap: 1rem; padding: 0.8rem 1rem; color: var(--text-muted); text-decoration: none; border-radius: 12px; margin-bottom: 0.5rem; transition: all 0.2s; font-weight: 500; }
        .nav-link:hover { background: #f1f5f9; color: var(--text-dark); }
        .nav-link.active { background: #eff6ff; color: var(--accent-blue); }

        /* UI Elements */
        .card { background: white; border: 1px solid var(--border); border-radius: 20px; padding: 1.5rem; box-shadow: var(--shadow); margin-bottom: 1.5rem; }
        .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.5rem; margin-bottom: 2.5rem; }
        .client-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1.5rem; }
        
        .client-card { cursor: pointer; border-left: 5px solid transparent; transition: all 0.3s; }
        .client-card:hover { transform: translateY(-4px); border-left-color: var(--accent-red); box-shadow: 0 10px 30px rgba(0,0,0,0.08); }

        .btn { padding: 0.75rem 1.5rem; border-radius: 12px; border: none; font-weight: 600; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; gap: 0.5rem; font-family: inherit; }
        .btn-primary { background: var(--accent-red); color: white; }
        .btn-secondary { background: #f1f5f9; color: var(--text-dark); }
        .btn-wa { background: #25d366; color: white; text-decoration: none; justify-content: center; }

        /* Modals */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.3); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 3000; }
        .modal.active { display: flex; }
        .modal-content { background: white; padding: 2.5rem; border-radius: 24px; width: 90%; max-width: 500px; }

        .form-group { margin-bottom: 1.25rem; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.5rem; color: var(--text-muted); }
        input, select, textarea { width: 100%; padding: 0.85rem; border: 1.5px solid #e2e8f0; border-radius: 12px; font-family: inherit; }

        /* Timeline & Tasks */
        .timeline { border-left: 2px solid #f1f5f9; padding-left: 1.5rem; position: relative; }
        .timeline-item { margin-bottom: 1.5rem; position: relative; }
        .timeline-item::before { content: ''; width: 10px; height: 10px; background: var(--accent-red); border-radius: 50%; position: absolute; left: -1.85rem; top: 0.5rem; border: 2px solid white; }
        
        .task-item { display: flex; align-items: center; gap: 1rem; padding: 0.75rem; border-radius: 10px; border: 1px solid #f1f5f9; margin-bottom: 0.5rem; }
        .task-item.done { opacity: 0.5; text-decoration: line-through; background: #f8fafc; }

        .badge { padding: 0.25rem 0.6rem; border-radius: 6px; font-size: 0.7rem; font-weight: 800; text-transform: uppercase; }
        .badge-blue { background: #e0f2fe; color: #0369a1; }
        .badge-green { background: #dcfce7; color: #15803d; }
    </style>
</head>
<body>

    <!-- Auth Gate -->
    <div id="auth-gate">
        <div class="gate-card">
            <h1 style="color: var(--accent-red); margin-bottom: 2rem;">Quest Spark</h1>
            <div id="gate-options">
                <button class="btn btn-primary" style="width: 100%; margin-bottom: 1rem; justify-content: center;" onclick="app.showLogin('coach')">Coach Portal</button>
                <button class="btn btn-secondary" style="width: 100%; justify-content: center;" onclick="app.showLogin('client')">Client Portal</button>
            </div>
            <div id="gate-login" style="display: none; margin-top: 2rem;">
                <h3 id="login-title">Login</h3>
                <form onsubmit="app.handleLogin(event)">
                    <div id="client-fields" style="display: none;">
                        <input type="text" id="g-phone" placeholder="Phone Number" style="margin-top: 1rem;">
                    </div>
                    <input type="password" id="g-pass" placeholder="Password" style="margin: 1rem 0;" required>
                    <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center;">Unlock Access</button>
                    <button type="button" class="btn btn-secondary" style="width: 100%; margin-top: 1rem; justify-content: center;" onclick="location.reload()">Back</button>
                </form>
            </div>
        </div>
    </div>

    <!-- App Container -->
    <div id="app">
        <aside>
            <div class="logo" onclick="app.setView('dashboard')">
                <i data-lucide="sparkles"></i>
                <span style="font-weight: 700;">Quest Spark</span>
            </div>
            <nav>
                <a href="#" class="nav-link active" id="nav-dashboard" onclick="app.setView('dashboard')"><i data-lucide="layout-dashboard"></i> Dashboard</a>
                <a href="#" class="nav-link" id="nav-clients" onclick="app.setView('clients')"><i data-lucide="users"></i> Directory</a>
                <a href="#" class="nav-link" id="nav-reports" onclick="app.setView('reports')"><i data-lucide="bar-chart-3"></i> Global Activity</a>
                <div style="margin-top: 2rem; border-top: 1px solid #eee; padding-top: 2rem;">
                    <button class="btn btn-primary" style="width: 100%;" onclick="app.showModal('client-form')">+ New Client</button>
                </div>
            </nav>
            <button class="btn btn-secondary" style="width: 100%; margin-top: auto;" onclick="location.reload()">Logout</button>
        </aside>
        
        <main>
            <div id="view-content"></div>
        </main>
    </div>

    <!-- Modals -->
    <div id="modal-client-form" class="modal">
        <div class="modal-content">
            <h2>Client Record</h2>
            <form onsubmit="app.saveClient(event)">
                <input type="hidden" id="f-id">
                <div class="form-group"><label>Full Name</label><input type="text" id="f-name" required></div>
                <div class="form-group"><label>Industry</label><input type="text" id="f-industry" required></div>
                <div class="form-group"><label>Phone</label><input type="text" id="f-phone" required></div>
                <div class="form-group"><label>Status</label><select id="f-status"><option value="Lead">Lead</option><option value="Onboarded">Onboarded</option></select></div>
                <div class="form-group"><label>Portal Password</label><input type="text" id="f-password" value="1234" required></div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Save Record</button>
                <button type="button" class="btn btn-secondary" style="width: 100%; margin-top: 1rem;" onclick="app.hideModals()">Cancel</button>
            </form>
        </div>
    </div>

    <div id="modal-task-form" class="modal">
        <div class="modal-content">
            <h2>New Homework Task</h2>
            <form onsubmit="app.saveTask(event)">
                <input type="hidden" id="t-client-id">
                <div class="form-group"><label>Task Description</label><input type="text" id="t-title" required placeholder="e.g. Complete Week 1 Workbook"></div>
                <div class="form-group"><label>Due Date</label><input type="date" id="t-due" required></div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Assign Task</button>
                <button type="button" class="btn btn-secondary" style="width: 100%; margin-top: 1rem;" onclick="app.hideModals()">Cancel</button>
            </form>
        </div>
    </div>

    <script>
        const SB_URL = "https://ivmomvigwanfhwkreqic.supabase.co";
        const SB_KEY = "sb_publishable_5nDWK1EEGa5xWzrKLEqNfw_BNgjFUBp";
        const sb = supabase.createClient(SB_URL, SB_KEY);

        const app = {
            state: { role: null, view: 'dashboard', activeClientId: null, clients: [], user: null, masterPass: 'spark2024' },

            async init() {
                lucide.createIcons();
                const { data } = await sb.from('config').select('value').eq('key', 'master_password').maybeSingle();
                if (data) this.state.masterPass = data.value;
            },

            showLogin(role) {
                this.state.role = role;
                document.getElementById('gate-options').style.display = 'none';
                document.getElementById('gate-login').style.display = 'block';
                document.getElementById('login-title').innerText = role === 'coach' ? 'Coach Access' : 'Client Access';
                if (role === 'client') document.getElementById('client-fields').style.display = 'block';
            },

            async handleLogin(e) {
                e.preventDefault();
                const pass = document.getElementById('g-pass').value;
                if (this.state.role === 'coach') {
                    if (pass === this.state.masterPass || pass === 'spark2024') this.unlock();
                    else alert("Invalid Password");
                } else {
                    const phone = document.getElementById('g-phone').value;
                    const { data } = await sb.from('clients').select('*').ilike('phone', `%${phone.slice(-9)}`).maybeSingle();
                    if (data && String(data.password) === String(pass)) {
                        this.state.user = data;
                        this.unlock();
                    } else alert("Access Denied");
                }
            },

            unlock() {
                document.getElementById('auth-gate').style.display = 'none';
                document.getElementById('app').style.display = 'flex';
                if (this.state.role === 'client') {
                    document.querySelector('aside').style.display = 'none';
                    document.querySelector('main').style.marginLeft = '0';
                }
                this.loadData();
            },

            async loadData() {
                const { data } = await sb.from('clients').select('*').order('name');
                this.state.clients = data || [];
                this.render();
            },

            setView(v, id = null) {
                this.state.view = v;
                this.state.activeClientId = id;
                document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
                const activeNav = document.getElementById(`nav-${v}`);
                if (activeNav) activeNav.classList.add('active');
                this.render();
            },

            showModal(id) { document.getElementById(`modal-${id}`).classList.add('active'); },
            hideModals() { document.querySelectorAll('.modal').forEach(m => m.classList.remove('active')); },

            async saveClient(e) {
                e.preventDefault();
                const id = document.getElementById('f-id').value;
                const obj = {
                    name: document.getElementById('f-name').value,
                    industry: document.getElementById('f-industry').value,
                    phone: document.getElementById('f-phone').value,
                    status: document.getElementById('f-status').value,
                    password: document.getElementById('f-password').value
                };
                if (id) await sb.from('clients').update(obj).eq('id', id);
                else await sb.from('clients').insert({...obj, history: [], tasks: [], files: []});
                this.hideModals(); this.loadData();
            },

            async saveTask(e) {
                e.preventDefault();
                const id = document.getElementById('t-client-id').value;
                const task = { id: Date.now(), title: document.getElementById('t-title').value, due: document.getElementById('t-due').value, status: 'pending' };
                const c = this.state.clients.find(x => x.id == id);
                const tasks = c.tasks || [];
                tasks.unshift(task);
                await sb.from('clients').update({ tasks }).eq('id', id);
                this.hideModals(); this.loadData();
            },

            async toggleTask(clientId, taskId) {
                const c = this.state.clients.find(x => x.id == clientId);
                const tasks = c.tasks.map(t => t.id === taskId ? {...t, status: t.status === 'done' ? 'pending' : 'done'} : t);
                await sb.from('clients').update({ tasks }).eq('id', clientId);
                this.loadData();
            },

            async deleteClient(id) {
                if (confirm("Delete client data permanently?")) {
                    await sb.from('clients').delete().eq('id', id);
                    this.setView('dashboard');
                    this.loadData();
                }
            },

            render() {
                const el = document.getElementById('view-content');
                if (this.state.role === 'client') return this.renderClientPortal(el);
                
                if (this.state.view === 'dashboard') this.renderDashboard(el);
                else if (this.state.view === 'clients') this.renderDirectory(el);
                else if (this.state.view === 'reports') this.renderGlobalActivity(el);
                else if (this.state.view === 'client-profile') this.renderClientProfile(el);
                lucide.createIcons();
            },

            renderDashboard(el) {
                const onboarded = this.state.clients.filter(c => c.status === 'Onboarded').length;
                el.innerHTML = `
                    <h1 style="margin-bottom: 2rem;">Overview</h1>
                    <div class="stat-grid">
                        <div class="card"><h3>${this.state.clients.length}</h3><p>Total Reach</p></div>
                        <div class="card"><h3 style="color: var(--accent-emerald)">${onboarded}</h3><p>Active Clients</p></div>
                    </div>
                    <h2>Recent Contacts</h2>
                    <div class="client-grid" style="margin-top: 1.5rem;">${this.state.clients.slice(0, 6).map(c => this.cardTpl(c)).join('')}</div>
                `;
            },

            renderDirectory(el) {
                el.innerHTML = `<h1>Client Directory</h1><div class="client-grid" style="margin-top: 2rem;">${this.state.clients.map(c => this.cardTpl(c)).join('')}</div>`;
            },

            renderClientProfile(el) {
                const c = this.state.clients.find(x => x.id == this.state.activeClientId);
                if (!c) return el.innerHTML = "Client not found";
                el.innerHTML = `
                    <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 2.5rem;">
                        <div>
                            <h1 style="font-size: 2.5rem; margin-bottom: 0.5rem;">${c.name}</h1>
                            <p style="color: var(--text-muted);"><i data-lucide="briefcase" style="width: 14px;"></i> ${c.industry} • <i data-lucide="phone" style="width: 14px;"></i> ${c.phone}</p>
                        </div>
                        <div style="display: flex; gap: 1rem;">
                            <button class="btn btn-secondary" onclick="app.deleteClient(${c.id})"><i data-lucide="trash-2"></i> Delete</button>
                            <a href="https://wa.me/254${c.phone.slice(-9)}" target="_blank" class="btn btn-wa"><i data-lucide="message-circle"></i> WhatsApp</a>
                        </div>
                    </div>

                    <div style="display: grid; grid-template-columns: 2fr 1.2fr; gap: 2rem;">
                        <div>
                            <div class="card">
                                <div style="display: flex; justify-content: space-between; margin-bottom: 1.5rem;">
                                    <h3>Action Timeline</h3>
                                    <button class="btn btn-primary" onclick="app.showActionModal(${c.id})">+ Log Session</button>
                                </div>
                                <div class="timeline">${(c.history || []).map(h => `
                                    <div class="timeline-item">
                                        <div class="timeline-date">${new Date(h.date).toLocaleDateString()} • <span class="badge badge-blue">${h.type}</span></div>
                                        <p style="background: #f8fafc; padding: 1rem; border-radius: 12px; border: 1px solid #eee;">${h.note}</p>
                                    </div>
                                `).join('')}</div>
                            </div>
                        </div>
                        <div>
                            <div class="card">
                                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                                    <h3>Homework</h3>
                                    <button class="btn btn-secondary" style="padding: 0.4rem 0.8rem; font-size: 0.8rem;" onclick="app.showTaskModal(${c.id})">+ Assign</button>
                                </div>
                                <div id="task-list">
                                    ${(c.tasks || []).map(t => `
                                        <div class="task-item ${t.status === 'done' ? 'done' : ''}">
                                            <input type="checkbox" ${t.status === 'done' ? 'checked' : ''} onchange="app.toggleTask(${c.id}, ${t.id})">
                                            <div style="flex: 1;">
                                                <p style="font-weight: 600; font-size: 0.9rem;">${t.title}</p>
                                                <p style="font-size: 0.7rem; color: var(--text-muted);">Due: ${new Date(t.due).toLocaleDateString()}</p>
                                            </div>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                            <div class="card">
                                <h3>Portal Access</h3>
                                <div style="margin-top: 1rem; padding: 1rem; background: #f0f9ff; border-radius: 12px; border: 1px solid #e0f2fe;">
                                    <p style="font-size: 0.8rem; color: #0369a1;"><b>Password:</b> ${c.password}</p>
                                    <p style="font-size: 0.8rem; color: #0369a1;"><b>Status:</b> ${c.status}</p>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            },

            renderClientPortal(el) {
                const c = this.state.clients.find(x => x.id === this.state.user.id);
                el.innerHTML = `
                    <div style="background: var(--accent-red); padding: 5rem 3rem; color: white; margin: -3rem -3rem 3rem -3rem;">
                        <h1>${c.name}</h1>
                        <p>Your Private Journey Hub</p>
                    </div>
                    <div style="display: grid; grid-template-columns: 2fr 1.2fr; gap: 2rem;">
                        <div class="card">
                            <h3>My Timeline</h3>
                            <div class="timeline" style="margin-top: 1.5rem;">${(c.history || []).map(h => `
                                <div class="timeline-item">
                                    <div class="timeline-date">${new Date(h.date).toLocaleDateString()}</div>
                                    <p>${h.note}</p>
                                </div>
                            `).join('')}</div>
                        </div>
                        <div>
                            <div class="card">
                                <h3>Homework Checklist</h3>
                                <div style="margin-top: 1.5rem;">${(c.tasks || []).map(t => `
                                    <div class="task-item ${t.status === 'done' ? 'done' : ''}">
                                        <i data-lucide="${t.status === 'done' ? 'check-circle' : 'circle'}"></i>
                                        <span>${t.title}</span>
                                    </div>
                                `).join('')}</div>
                            </div>
                        </div>
                    </div>
                `;
            },

            cardTpl(c) {
                return `
                    <div class="card client-card" onclick="app.setView('client-profile', ${c.id})">
                        <div style="display: flex; justify-content: space-between; margin-bottom: 1rem;">
                            <span class="badge ${c.status === 'Lead' ? 'badge-blue' : 'badge-green'}">${c.status}</span>
                            <i data-lucide="chevron-right" style="width: 16px; color: var(--text-muted);"></i>
                        </div>
                        <h3>${c.name}</h3>
                        <p style="color: var(--text-muted); font-size: 0.8rem;">${c.industry}</p>
                    </div>
                `;
            },

            showActionModal(id) { 
                const note = prompt("Enter session note:");
                if(note) this.saveSimpleAction(id, note);
            },
            async saveSimpleAction(id, note) {
                const c = this.state.clients.find(x => x.id == id);
                const history = c.history || [];
                history.unshift({ date: new Date().toISOString(), note, type: 'Session', from: 'Coach' });
                await sb.from('clients').update({ history }).eq('id', id);
                this.loadData();
            },
            showTaskModal(id) {
                document.getElementById('t-client-id').value = id;
                document.getElementById('t-title').value = '';
                this.showModal('task-form');
            }
        };

        app.init();
    </script>
</body>
</html>
