<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quest Spark | Collaborative Coaching CRM</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;600;700&display=swap');
        
        :root {
            --bg-main: #f0f9ff;
            --glass: rgba(255, 255, 255, 0.85);
            --accent-red: #8b1e1e;
            --accent-blue: #0284c7;
            --accent-emerald: #059669;
            --text-dark: #0f172a;
            --text-muted: #475569;
            --border: rgba(0, 0, 0, 0.1);
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--bg-main); color: var(--text-dark); min-height: 100vh; line-height: 1.6; }
        h1, h2, h3 { font-family: 'Outfit', sans-serif; font-weight: 700; }

        /* Auth Gate */
        #auth-gate { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
            display: flex; align-items: center; justify-content: center; z-index: 2000;
        }
        .gate-card { background: white; padding: 3rem; border-radius: 32px; width: 100%; max-width: 450px; text-align: center; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.1); }

        /* Layout */
        #app { display: none; min-height: 100vh; }
        aside { width: 280px; background: white; border-right: 1px solid var(--border); padding: 2rem; position: fixed; height: 100vh; z-index: 100; }
        main { flex: 1; margin-left: 280px; padding: 3rem; max-width: 1400px; }

        /* Navigation */
        .logo { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 3rem; color: var(--accent-red); font-size: 1.25rem; }
        .nav-link { display: flex; align-items: center; gap: 1rem; padding: 0.75rem 1rem; color: var(--text-muted); text-decoration: none; border-radius: 12px; margin-bottom: 0.5rem; transition: all 0.2s; font-weight: 500; }
        .nav-link:hover { background: #f8fafc; color: var(--text-dark); }
        .nav-link.active { background: #eff6ff; color: var(--accent-blue); }

        /* Cards */
        .card { background: var(--glass); backdrop-filter: blur(12px); border: 1px solid var(--border); border-radius: 20px; padding: 1.5rem; box-shadow: var(--shadow); margin-bottom: 1.5rem; }
        .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.5rem; margin-bottom: 2.5rem; }
        .client-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1.5rem; }
        .client-card { transition: all 0.3s; border-left: 5px solid transparent; }
        .client-card:hover { transform: translateY(-4px); }
        .client-card.lead { border-color: var(--accent-blue); }
        .client-card.onboarded { border-color: var(--accent-emerald); }

        /* Buttons */
        .btn { padding: 0.75rem 1.5rem; border-radius: 12px; border: none; font-weight: 600; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; gap: 0.5rem; font-family: inherit; font-size: 0.9rem; }
        .btn-primary { background: var(--accent-red); color: white; }
        .btn-secondary { background: #f1f5f9; color: var(--text-dark); }
        .btn-wa { background: #25d366; color: white; text-decoration: none; justify-content: center; }

        /* Modals */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.4); backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center; z-index: 3000; }
        .modal.active { display: flex; }
        .modal-content { background: white; padding: 2.5rem; border-radius: 28px; width: 90%; max-width: 500px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.3); }

        .form-group { margin-bottom: 1.25rem; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.5rem; color: var(--text-muted); }
        input, select, textarea { width: 100%; padding: 0.85rem; border: 1.5px solid #e2e8f0; border-radius: 12px; font-family: inherit; }

        /* Timeline */
        .timeline { border-left: 2px solid #e2e8f0; padding-left: 1.5rem; margin-left: 0.5rem; }
        .timeline-item { margin-bottom: 2rem; position: relative; }
        .timeline-item::before { content: ''; width: 12px; height: 12px; background: var(--accent-red); border-radius: 50%; position: absolute; left: -1.95rem; top: 0.4rem; border: 3px solid white; }
        .timeline-date { font-size: 0.75rem; color: var(--accent-blue); font-weight: 700; margin-bottom: 0.25rem; }

        /* Tags */
        .badge { padding: 0.25rem 0.6rem; border-radius: 6px; font-size: 0.7rem; font-weight: 800; text-transform: uppercase; }
        .badge-feedback { background: #fef3c7; color: #92400e; }
        .badge-session { background: #dcfce7; color: #166534; }
        .badge-file { background: #e0f2fe; color: #075985; }

        @media print {
            aside, .btn, .modal { display: none !important; }
            main { margin-left: 0 !important; padding: 0 !important; }
        }
    </style>
</head>
<body>

    <!-- Auth Gate -->
    <div id="auth-gate">
        <div class="gate-card">
            <h1 style="color: var(--accent-red); margin-bottom: 2rem;">Quest Spark</h1>
            <div id="gate-options" style="display: flex; flex-direction: column; gap: 1rem;">
                <button class="btn btn-primary" onclick="app.prepCoachLogin()" style="justify-content: center;">Coach Portal</button>
                <button class="btn btn-secondary" onclick="app.prepClientLogin()" style="justify-content: center;">Client Portal</button>
            </div>
            <div id="coach-gate-form" style="display: none;">
                <h3>Coach Access</h3>
                <form onsubmit="app.handleCoachLogin(event)">
                    <input type="password" id="g-coach-pass" placeholder="Enter Master Password" style="margin: 1.5rem 0;" required>
                    <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center;">Unlock</button>
                    <button type="button" class="btn btn-secondary" style="width: 100%; margin-top: 1rem; justify-content: center;" onclick="app.resetGate()">Back</button>
                </form>
            </div>
            <div id="client-gate-form" style="display: none;">
                <h3>Client Access</h3>
                <form onsubmit="app.handleClientLogin(event)">
                    <input type="text" id="g-client-phone" placeholder="Phone Number" style="margin-top: 1.5rem;" required>
                    <input type="password" id="g-client-pass" placeholder="Access Password" style="margin: 1rem 0;" required>
                    <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center;">View Journey</button>
                    <button type="button" class="btn btn-secondary" style="width: 100%; margin-top: 1rem; justify-content: center;" onclick="app.resetGate()">Back</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Main App -->
    <div id="app">
        <aside>
            <div class="logo"><b>Quest Spark</b></div>
            <nav>
                <a href="#" class="nav-link active" onclick="app.setView('dashboard')"><i data-lucide="layout-dashboard"></i> Dashboard</a>
                <a href="#" class="nav-link" onclick="app.setView('clients')"><i data-lucide="users"></i> Clients</a>
                <a href="#" class="nav-link" onclick="app.setView('reports')"><i data-lucide="bar-chart-3"></i> Reports</a>
                <div style="margin-top: 2rem; border-top: 1px solid #eee; padding-top: 2rem;">
                    <button class="btn btn-primary" style="width: 100%;" onclick="app.showAddClient()">+ New Client</button>
                </div>
            </nav>
            <button class="btn btn-secondary" style="width: 100%; margin-top: auto;" onclick="location.reload()">Logout</button>
        </aside>
        
        <main>
            <div id="view-content"></div>
        </main>
    </div>

    <!-- Modals -->
    <div id="modal-client-form" class="modal">
        <div class="modal-content">
            <h2 id="client-form-title">Contact Info</h2>
            <form onsubmit="app.saveClient(event)">
                <input type="hidden" id="f-id">
                <div class="form-group"><label>Name</label><input type="text" id="f-name" required></div>
                <div class="form-group"><label>Sector</label><input type="text" id="f-industry" required></div>
                <div class="form-group"><label>Phone</label><input type="text" id="f-phone" required></div>
                <div class="form-group"><label>Status</label><select id="f-status"><option value="Lead">Lead</option><option value="Onboarded">Onboarded</option></select></div>
                <div class="form-group"><label>Portal Password</label><input type="text" id="f-password" value="1234" required></div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Save Client</button>
                <button type="button" class="btn btn-secondary" style="width: 100%; margin-top: 1rem;" onclick="app.hideModals()">Cancel</button>
            </form>
        </div>
    </div>

    <div id="modal-log-action" class="modal">
        <div class="modal-content">
            <h2 id="log-action-title">Log Update</h2>
            <form onsubmit="app.saveAction(event)">
                <input type="hidden" id="l-client-id">
                <div class="form-group"><label>Note</label><textarea id="l-note" rows="4" required></textarea></div>
                <div class="form-group"><label>Type</label><select id="l-type"><option value="Session">Session</option><option value="Task">Assign Task</option><option value="Update">Coach Update</option></select></div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Post Update</button>
                <button type="button" class="btn btn-secondary" style="width: 100%; margin-top: 1rem;" onclick="app.hideModals()">Cancel</button>
            </form>
        </div>
    </div>

    <script>
        const SB_URL = "https://ivmomvigwanfhwkreqic.supabase.co";
        const SB_KEY = "sb_publishable_5nDWK1EEGa5xWzrKLEqNfw_BNgjFUBp";
        const sb = supabase.createClient(SB_URL, SB_KEY);

        const app = {
            state: { role: null, view: 'dashboard', clients: [], user: null, masterPass: 'spark2024' },
            
            async init() {
                lucide.createIcons();
                const { data } = await sb.from('config').select('value').eq('key', 'master_password').maybeSingle();
                if (data) this.state.masterPass = data.value;
            },

            // Auth UI
            resetGate() {
                document.getElementById('gate-options').style.display = 'flex';
                document.getElementById('coach-gate-form').style.display = 'none';
                document.getElementById('client-gate-form').style.display = 'none';
            },
            prepCoachLogin() {
                document.getElementById('gate-options').style.display = 'none';
                document.getElementById('coach-gate-form').style.display = 'block';
            },
            prepClientLogin() {
                document.getElementById('gate-options').style.display = 'none';
                document.getElementById('client-gate-form').style.display = 'block';
            },

            async handleCoachLogin(e) {
                e.preventDefault();
                const pass = document.getElementById('g-coach-pass').value;
                if (pass === this.state.masterPass || pass === 'spark2024') {
                    this.state.role = 'coach';
                    this.unlock();
                } else alert("Invalid Password.");
            },
            async handleClientLogin(e) {
                e.preventDefault();
                const phone = document.getElementById('g-client-phone').value;
                const pass = document.getElementById('g-client-pass').value;
                const { data } = await sb.from('clients').select('*').ilike('phone', `%${phone.slice(-9)}`).maybeSingle();
                if (data && String(data.password) === String(pass)) {
                    this.state.role = 'client';
                    this.state.user = data;
                    this.unlock();
                } else alert("Access denied.");
            },
            unlock() {
                document.getElementById('auth-gate').style.display = 'none';
                document.getElementById('app').style.display = 'flex';
                if (this.state.role === 'client') {
                    document.querySelector('aside').style.display = 'none';
                    document.querySelector('main').style.marginLeft = '0';
                }
                this.loadData();
            },

            async loadData() {
                const { data } = await sb.from('clients').select('*').order('name');
                this.state.clients = data || [];
                if (this.state.role === 'client') {
                    this.state.user = this.state.clients.find(c => c.id === this.state.user.id);
                }
                this.render();
            },

            setView(v) { this.state.view = v; this.render(); },
            hideModals() { document.querySelectorAll('.modal').forEach(m => m.classList.remove('active')); },

            // Actions
            showAddClient() {
                document.getElementById('f-id').value = '';
                document.getElementById('client-form').reset();
                document.getElementById('modal-client-form').classList.add('active');
            },
            showEditClient(id) {
                const c = this.state.clients.find(x => x.id === id);
                document.getElementById('f-id').value = c.id;
                document.getElementById('f-name').value = c.name;
                document.getElementById('f-industry').value = c.industry;
                document.getElementById('f-phone').value = c.phone;
                document.getElementById('f-status').value = c.status;
                document.getElementById('f-password').value = c.password;
                document.getElementById('modal-client-form').classList.add('active');
            },
            async saveClient(e) {
                e.preventDefault();
                const id = document.getElementById('f-id').value;
                const obj = {
                    name: document.getElementById('f-name').value,
                    industry: document.getElementById('f-industry').value,
                    phone: document.getElementById('f-phone').value,
                    status: document.getElementById('f-status').value,
                    password: document.getElementById('f-password').value
                };
                if (id) await sb.from('clients').update(obj).eq('id', id);
                else await sb.from('clients').insert({...obj, history: [], tasks: [], files: []});
                this.hideModals(); this.loadData();
            },
            showLogAction(id) {
                document.getElementById('l-client-id').value = id;
                document.getElementById('l-note').value = '';
                document.getElementById('modal-log-action').classList.add('active');
            },
            async saveAction(e) {
                e.preventDefault();
                const id = document.getElementById('l-client-id').value;
                const type = document.getElementById('l-type').value;
                const note = document.getElementById('l-note').value;
                const c = this.state.clients.find(x => x.id == id);
                const history = c.history || [];
                history.unshift({ date: new Date().toISOString(), note, type, from: 'Coach' });
                await sb.from('clients').update({ history }).eq('id', id);
                this.hideModals(); this.loadData();
            },

            // Client Portal Logic
            async postFeedback() {
                const note = document.getElementById('cl-feedback').value;
                if (!note) return;
                const history = this.state.user.history || [];
                history.unshift({ date: new Date().toISOString(), note, type: 'Feedback', from: 'Client' });
                await sb.from('clients').update({ history }).eq('id', this.state.user.id);
                document.getElementById('cl-feedback').value = '';
                this.loadData();
            },
            async uploadFile(e) {
                const file = e.target.files[0];
                if (!file) return;
                const path = `quest-spark/${Date.now()}_${file.name}`;
                const { data, error } = await sb.storage.from('assets').upload(path, file);
                if (error) {
                    alert("Bucket 'assets' not found. Please create it in Supabase.");
                    return;
                }
                const url = sb.storage.from('assets').getPublicUrl(path).data.publicUrl;
                const files = this.state.user.files || [];
                files.unshift({ name: file.name, url, date: new Date().toISOString() });
                const history = this.state.user.history || [];
                history.unshift({ date: new Date().toISOString(), note: `Shared file: ${file.name}`, type: 'File', url, from: 'Client' });
                await sb.from('clients').update({ files, history }).eq('id', this.state.user.id);
                this.loadData();
            },

            render() {
                const el = document.getElementById('view-content');
                if (this.state.role === 'client') return this.renderClientPortal(el);
                
                if (this.state.view === 'dashboard') this.renderDashboard(el);
                if (this.state.view === 'clients') this.renderClients(el);
                if (this.state.view === 'reports') this.renderReports(el);
                lucide.createIcons();
            },

            renderDashboard(el) {
                const leads = this.state.clients.filter(c => c.status === 'Lead').length;
                const onboarded = this.state.clients.filter(c => c.status === 'Onboarded').length;
                el.innerHTML = `
                    <h1 style="margin-bottom: 2rem;">Overview</h1>
                    <div class="stat-grid">
                        <div class="card"><h3>${this.state.clients.length}</h3><p>Total Clients</p></div>
                        <div class="card"><h3 style="color: var(--accent-blue)">${leads}</h3><p>Active Leads</p></div>
                        <div class="card"><h3 style="color: var(--accent-emerald)">${onboarded}</h3><p>Onboarded</p></div>
                    </div>
                    <h2 style="margin-bottom: 1.5rem;">Collaboration Hub</h2>
                    <div class="client-grid">${this.state.clients.slice(0, 6).map(c => this.cardTpl(c)).join('')}</div>
                `;
            },

            renderClients(el) {
                el.innerHTML = `<h1>Directory</h1><div class="client-grid">${this.state.clients.map(c => this.cardTpl(c)).join('')}</div>`;
            },

            renderReports(el) {
                el.innerHTML = `
                    <div style="display: flex; justify-content: space-between; margin-bottom: 2rem;">
                        <h1>Collaboration Log</h1>
                        <button class="btn btn-primary" onclick="window.print()">Export PDF</button>
                    </div>
                    <div class="card">
                        <table style="width: 100%; text-align: left;">
                            <tr style="border-bottom: 2px solid #eee;"><th style="padding: 1rem;">Client</th><th style="padding: 1rem;">Update</th><th style="padding: 1rem;">From</th><th style="padding: 1rem;">Date</th></tr>
                            ${this.state.clients.flatMap(c => (c.history || []).map(h => `
                                <tr style="border-bottom: 1px solid #f8fafc;">
                                    <td style="padding: 1rem;"><b>${c.name}</b></td>
                                    <td style="padding: 1rem;">${h.note} ${h.url ? `<br><a href="${h.url}" target="_blank" style="font-size: 0.7rem; color: var(--accent-blue);">[View Attachment]</a>` : ''}</td>
                                    <td style="padding: 1rem;"><span class="badge ${h.from === 'Coach' ? 'badge-session' : 'badge-feedback'}">${h.from}</span></td>
                                    <td style="padding: 1rem;">${new Date(h.date).toLocaleDateString()}</td>
                                </tr>
                            `)).join('')}
                        </table>
                    </div>
                `;
            },

            renderClientPortal(el) {
                const c = this.state.user;
                el.innerHTML = `
                    <div style="background: var(--accent-red); padding: 5rem 3rem; color: white; margin: -3rem -3rem 3rem -3rem;">
                        <h1>Welcome, ${c.name}</h1>
                        <p>Your Private Coaching Workspace</p>
                    </div>
                    <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 2rem;">
                        <div>
                            <div class="card">
                                <h3>Share Feedback or Update</h3>
                                <textarea id="cl-feedback" rows="3" style="margin: 1rem 0;" placeholder="What's on your mind?"></textarea>
                                <div style="display: flex; justify-content: space-between; align-items: center;">
                                    <label class="btn btn-secondary" style="cursor: pointer;">
                                        <i data-lucide="upload"></i> Upload Work
                                        <input type="file" style="display: none;" onchange="app.uploadFile(event)">
                                    </label>
                                    <button class="btn btn-primary" onclick="app.postFeedback()">Post Update</button>
                                </div>
                            </div>
                            <div class="card">
                                <h3>Journey Timeline</h3>
                                <div class="timeline" style="margin-top: 1.5rem;">${(c.history || []).map(h => `
                                    <div class="timeline-item">
                                        <div class="timeline-date">${new Date(h.date).toLocaleDateString()} • ${h.type}</div>
                                        <div class="card" style="margin: 0.5rem 0; padding: 1rem; border-color: #eee;">
                                            <p>${h.note}</p>
                                            ${h.url ? `<a href="${h.url}" target="_blank" style="color: var(--accent-blue); font-size: 0.8rem; display: block; margin-top: 0.5rem;">📎 View Attached File</a>` : ''}
                                        </div>
                                    </div>
                                `).join('')}</div>
                            </div>
                        </div>
                        <div>
                            <div class="card">
                                <h3>Quick Actions</h3>
                                <a href="https://wa.me/254711980306" class="btn btn-wa" style="width: 100%; margin-top: 1rem;">Message Coach</a>
                            </div>
                            <div class="card">
                                <h3>Shared Assets</h3>
                                <div style="margin-top: 1rem;">${(c.files || []).map(f => `
                                    <a href="${f.url}" target="_blank" style="display: block; padding: 0.5rem; border: 1px solid #eee; border-radius: 8px; margin-bottom: 0.5rem; text-decoration: none; color: inherit; font-size: 0.8rem;">
                                        <i data-lucide="file-text" style="width: 14px; margin-right: 5px;"></i> ${f.name}
                                    </a>
                                `).join('')}</div>
                            </div>
                        </div>
                    </div>
                `;
            },

            cardTpl(c) {
                return `
                    <div class="card client-card ${c.status.toLowerCase()}">
                        <div style="display: flex; justify-content: space-between; margin-bottom: 1rem;">
                            <span class="badge ${c.status === 'Lead' ? 'badge-file' : 'badge-session'}">${c.status}</span>
                            <button onclick="app.showEditClient(${c.id})" style="background:none; border:none; cursor:pointer;"><i data-lucide="settings" style="width: 16px;"></i></button>
                        </div>
                        <h3>${c.name}</h3>
                        <p style="color: var(--text-muted); font-size: 0.8rem; margin-bottom: 1.5rem;">${c.industry}</p>
                        <div style="display: flex; flex-direction: column; gap: 0.5rem;">
                            <button class="btn btn-primary" onclick="app.showLogAction(${c.id})">Post Update</button>
                            <a href="https://wa.me/254${c.phone.slice(-9)}" class="btn btn-wa" target="_blank">WhatsApp</a>
                        </div>
                    </div>
                `;
            }
        };

        app.init();
    </script>
</body>
</html>
